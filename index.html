<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#87977c" />
    <meta name="description" content="Jeu photo chronologique de notre mariage" />
    <title>Notre histoire en 21 photos</title>
    <style>
      .wedding-nav{display:none!important}
      .global-game-nav{position:fixed;z-index:9999;left:16px;bottom:16px;display:flex;gap:8px;align-items:center;padding:8px;border-radius:18px;background:#fffdf8ee;border:1px solid #dfe5da;box-shadow:0 14px 40px #50604c44;backdrop-filter:blur(12px)}
      .global-game-nav a{display:flex;align-items:center;gap:7px;padding:10px 12px;border-radius:12px;color:#344132;text-decoration:none;font:700 13px Inter,system-ui,sans-serif;white-space:nowrap}
      .global-game-nav a:hover,.global-game-nav a.active{background:#e8efe4}
      .global-game-nav .icon{font-size:20px}
      @media(max-width:720px){.global-game-nav{left:8px;right:8px;bottom:8px;justify-content:space-around;padding:6px}.global-game-nav a{flex-direction:column;gap:2px;padding:7px 8px;font-size:10px}.global-game-nav .icon{font-size:21px}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <nav class="global-game-nav" aria-label="Navigation entre les trois applications">
      <a href="https://photos.laura-giova.be/connexion/?next=/appareil/"><span class="icon">📸</span><span>Photos</span></a>
      <a href="https://www.laura-giova.be/"><span class="icon">🎵</span><span>Hit & Kiss</span></a>
      <a class="active" href="https://photos.laura-giova.be/"><span class="icon">🧩</span><span>Notre histoire</span></a>
    </nav>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const ID_COOKIE='lg_identity';
      function sharedIdentity(){const row=document.cookie.split('; ').find(x=>x.startsWith(ID_COOKIE+'='));if(!row)return null;try{return JSON.parse(decodeURIComponent(row.slice(ID_COOKIE.length+1)))}catch{return null}}

      // Lors d'un changement d'identité, supprimer toutes les variantes possibles
      // du cookie avant que React enregistre la nouvelle valeur. Cela évite qu'un
      // ancien cookie de domaine masque le nouveau cookie du sous-domaine.
      document.addEventListener('submit',event=>{
        const form=event.target;
        if(!(form instanceof HTMLFormElement)||!form.classList.contains('start-form'))return;
        if(new URLSearchParams(location.search).get('change')!=='1')return;
        document.cookie=`${ID_COOKIE}=; Max-Age=0; Path=/; SameSite=Lax; Secure`;
        document.cookie=`${ID_COOKIE}=; Max-Age=0; Path=/; Domain=.laura-giova.be; SameSite=Lax; Secure`;
      },true);

      const identity=sharedIdentity();
      if(!identity){location.replace('/connexion/?next=/')}else{
        localStorage.setItem('lg-guest',`${identity.firstName||''} ${identity.lastName||''}`.trim());
        localStorage.setItem('lg-table',identity.table||'');
        const label=identity.table?`${identity.table} · ${identity.firstName} ${identity.lastName}`.trim():`${identity.firstName} ${identity.lastName}`.trim();
        const observer=new MutationObserver(()=>{const input=document.querySelector('.start-form input');if(!input||input.dataset.identityReady)return;input.dataset.identityReady='1';const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;setter.call(input,label);input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}))});
        observer.observe(document.documentElement,{subtree:true,childList:true});
      }
    </script>
  </body>
</html>
