name: Tests navigation mariage

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '15 6 * * *'

jobs:
  navigation-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Attendre le déploiement production
        if: github.event_name == 'push'
        run: sleep 90

      - name: Tester les URL et navigations de production
        run: npm run test:e2e -- --grep-invert "Cloudflare"

      - name: Conserver le rapport production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright-production
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  navigation-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://notre-histoire-mariage.giovanni-fragapane.workers.dev

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Attendre le déploiement Cloudflare
        if: github.event_name == 'push'
        run: sleep 75

      - name: Tester Cloudflare de bout en bout
        run: npx playwright test tests/e2e/cloudflare.spec.ts

      - name: Conserver le rapport Cloudflare
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright-cloudflare
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
