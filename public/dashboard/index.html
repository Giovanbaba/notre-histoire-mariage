<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0c0c"><title>Tableau de bord | Lau & Gio</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#372d1e,#111 42%,#080808);color:#fff;padding:28px}.wrap{max-width:1200px;margin:auto}.brand{letter-spacing:.26em;text-transform:uppercase;color:#e8c87f;font-size:12px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:12px 0 28px}.hero h1{font-family:Georgia,serif;font-size:clamp(42px,8vw,82px);line-height:.95;margin:0}.live{padding:10px 15px;border:1px solid #4f4f4f;border-radius:999px;background:#131313}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#72df8d;box-shadow:0 0 12px #72df8d;margin-right:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}.card{padding:22px;border:1px solid #3f3a32;border-radius:22px;background:#181818cc}.big{font-size:42px;font-weight:900;color:#f0ca78}.label{color:#aaa;margin-top:4px}.tables{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 26px}.pill{padding:9px 13px;border-radius:999px;background:#24211b;border:1px solid #4a4234;color:#e8d8b4}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.photo{aspect-ratio:1;overflow:hidden;border-radius:16px;background:#222}.photo img{width:100%;height:100%;object-fit:cover;display:block}.empty{padding:40px;border:1px dashed #555;border-radius:20px;text-align:center;color:#aaa}.error{color:#ffaaa8}@media(max-width:760px){body{padding:18px}.hero{display:block}.live{display:inline-block;margin-top:15px}.stats{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><div class="brand">L’appareil photo de Lau & Gio</div><div class="hero"><h1>Nos souvenirs<br>en direct</h1><div class="live"><span class="dot"></span>Actualisation automatique</div></div><section class="stats"><div class="card"><div class="big" id="total">—</div><div class="label">photos reçues</div></div><div class="card"><div class="big" id="tablesCount">—</div><div class="label">tables participantes</div></div><div class="card"><div class="big" id="last">—</div><div class="label">dernière photo</div></div></section><h2>Participation</h2><div class="tables" id="tables"></div><h2>Derniers souvenirs</h2><div class="grid" id="grid"><div class="empty">Chargement des photos…</div></div></main><script>const $=id=>document.getElementById(id);function ago(value){if(!value)return'—';const s=Math.max(0,Math.floor((Date.now()-new Date(value))/1000));if(s<60)return`il y a ${s}s`;if(s<3600)return`il y a ${Math.floor(s/60)} min`;return`il y a ${Math.floor(s/3600)} h`}async function load(){try{const r=await fetch('/api/dashboard',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error();$('total').textContent=d.total;$('tablesCount').textContent=d.tables.length;$('last').textContent=ago(d.recent[0]?.modified);$('tables').innerHTML=d.tables.length?d.tables.map(t=>`<span class="pill">${t.name} · ${t.count}</span>`).join(''):'<span class="pill">Pas encore de table</span>';$('grid').innerHTML=d.recent.length?d.recent.map(p=>`<div class="photo"><img src="${p.url}" loading="lazy" alt="Souvenir"></div>`).join(''):'<div class="empty">Les premières photos apparaîtront ici.</div>'}catch{$('grid').innerHTML='<div class="empty error">Impossible de charger le tableau de bord.</div>'}}load();setInterval(load,10000);</script></body></html>
