<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172542">
<title>Photos du mariage · Laura & Giovanni</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 18px 130px;background:radial-gradient(circle at top,#3f537b,#172542 52%,#0d1629);font-family:Inter,system-ui,sans-serif;color:#172542}.wrap{width:min(1180px,100%);margin:auto}.hero{text-align:center;color:#fff;margin:8px auto 26px}.hero .icon{font-size:52px}.hero h1{margin:8px 0 6px;font-family:Georgia,serif;font-size:clamp(34px,7vw,58px)}.hero p{margin:0;color:#e5dbc9}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;padding:12px 14px;border-radius:16px;background:#fffaf4}.toolbar b{font-size:15px}.toolbar button{border:0;border-radius:12px;padding:10px 14px;background:#172542;color:white;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{overflow:hidden;border-radius:20px;background:#fffaf4;box-shadow:0 14px 38px #0005}.media{width:100%;aspect-ratio:1/1;display:block;background:#0d1629;object-fit:cover}.meta{padding:12px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin:4px 0 10px;color:#766f64;font-size:12px}.download{display:block;width:100%;padding:11px 12px;border-radius:12px;background:#d8b66f;color:#172542;text-align:center;text-decoration:none;font-weight:900}.empty,.loading{padding:40px 20px;text-align:center;border-radius:20px;background:#fffaf4}.error{color:#8f1f1f}.back{display:inline-block;margin-top:18px;color:white;font-weight:800;text-decoration:none}@media(max-width:560px){body{padding-left:10px;padding-right:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.meta{padding:9px}.name{font-size:13px}.download{font-size:12px;padding:9px 7px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><div class="icon">🖼️</div><h1>Photos du mariage</h1><p>Les souvenirs partagés par nos invités · consultation et téléchargement</p></header>
<div class="toolbar"><b id="count">Chargement…</b><button id="reload" type="button">Actualiser</button></div>
<section id="grid" class="grid"><div class="loading">Chargement des souvenirs…</div></section>
<a class="back" href="/accueil/">← Retour à l’accueil</a>
</main>
<script>
const row=document.cookie.split('; ').find(x=>x.startsWith('lg_identity='));
if(!row){location.replace('/connexion/?next=/photos-mariage/')}
const grid=document.querySelector('#grid'),count=document.querySelector('#count');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const size=n=>n>1048576?(n/1048576).toFixed(1)+' Mo':Math.max(1,Math.round(n/1024))+' Ko';
async function load(){
 grid.innerHTML='<div class="loading">Chargement des souvenirs…</div>';
 try{
   const r=await fetch('/api/gallery?kind=photo',{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status);
   const d=await r.json(),items=d.items||[]; count.textContent=items.length+' photo${items.length>1?"s":""}';
   if(!items.length){grid.innerHTML='<div class="empty">Aucun souvenir disponible pour le moment.</div>';return}
   grid.innerHTML=items.map(item=>`<article class="card"><img class="media" loading="lazy" src="${item.url}" alt="Souvenir du mariage"><div class="meta"><div class="name">${esc(item.guest||'Invité')}</div><div class="sub">Table ${esc(item.table||'—')} · ${size(item.size||0)}</div><a class="download" href="${item.downloadUrl}">⬇️ Télécharger</a></div></article>`).join('');
 }catch(e){count.textContent='Indisponible';grid.innerHTML='<div class="empty error">Impossible de charger les souvenirs pour le moment.</div>'}
}
document.querySelector('#reload').addEventListener('click',load);load();
</script>
</body></html>
