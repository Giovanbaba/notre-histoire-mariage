<script id="legacySource" type="application/json">"\u003c!doctype html>\u003chtml lang=\"fr\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Conubia — Un jour à vous\u003c/title>\u003cstyle>\n:root{--ink:#263e37;--accent:#496b57;--paper:#fcfaf5;--soft:#e8eee5;--line:#dddcd2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button,a,input,select,textarea{outline-offset:4px}button{border:1px solid var(--line);border-radius:9px;padding:11px 16px;background:white;color:var(--ink)}button:hover{border-color:var(--accent);background:var(--soft)}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:var(--ink);color:white}h1,h2,h3,.brand{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(38px,5vw,70px);line-height:1.05;margin:16px 0}h2{font-size:32px;margin:12px 0}h3{font-size:25px;margin:8px 0}p{line-height:1.65}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700}.muted{color:#63766d}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 4%;border-bottom:1px solid var(--line);gap:15px;flex-wrap:wrap}.brand{font-size:30px;letter-spacing:-1px}.brand i{color:#a4804c}.badge{font:11px system-ui;background:var(--soft);padding:6px 9px;border-radius:20px;letter-spacing:.4px}.top-actions,.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.notice{font-size:12px;text-align:center;padding:9px;background:#f1eadc;color:#63543b}.layout{display:grid;grid-template-columns:290px 1fr;min-height:80vh}aside{padding:25px;border-right:1px solid var(--line);background:white}.step{display:block;width:100%;text-align:left;margin:5px 0;border:0;background:transparent}.step.active{background:var(--soft);font-weight:650}.panel{margin-top:25px}label{display:block;font-size:12px;font-weight:650;margin:18px 0 7px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)}input[type=checkbox]{width:auto}input[type=color]{height:42px;padding:4px}main{padding:32px 5%;min-width:0}.workspace-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.canvas{max-width:1000px;margin:auto;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:white;box-shadow:0 16px 55px #263e370a}.canvas.mobile{max-width:390px}.event-nav{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:12px;gap:10px}.hero{display:grid;grid-template-columns:1.1fr 1fr;min-height:400px}.hero-copy{padding:55px 36px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.art{background:#e6ebdf;position:relative;overflow:hidden;min-height:320px;display:grid;place-items:center}.art svg{width:100%;height:100%;position:absolute;inset:0}.art img{width:100%;height:100%;position:absolute;object-fit:cover}.art .stamp{position:relative;border:1px solid #ffffffa0;border-radius:50%;width:185px;height:185px;display:grid;place-content:center;text-align:center;background:#ffffff50;backdrop-filter:blur(3px);font:43px Georgia}.stamp small{font:10px system-ui;letter-spacing:3px;margin-top:12px}.section{padding:32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:11px;padding:22px;background:var(--paper)}.card p{font-size:13px}.card .symbol{font-size:28px;margin-bottom:13px}.event-tabs{display:flex;gap:5px;padding:12px 20px;flex-wrap:wrap;background:var(--paper);border-bottom:1px solid var(--line)}.event-tabs button{padding:8px 11px;font-size:12px;border:0;background:transparent}.event-tabs .active{background:var(--soft)}.mobile .hero{grid-template-columns:1fr}.mobile .hero-copy{padding:30px}.mobile .art{min-height:230px}.mobile .grid{grid-template-columns:1fr}.timeline{border-left:1px solid var(--accent);padding-left:24px;margin:24px 10px}.timeline article{margin:0 0 25px}.timeline time{font-size:12px;font-weight:700}.camera{background:#24342e;color:#fff;border-radius:16px;padding:25px;max-width:500px;margin:20px auto}.lens{height:180px;border:1px dashed #89988b;border-radius:10px;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#526456,#23352d)}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.photo{background:var(--soft);border-radius:8px;overflow:hidden}.photo img{width:100%;height:150px;object-fit:cover}.photo p{font-size:11px;padding:8px;margin:0}.film{display:flex;gap:4px;flex-wrap:wrap;margin:15px 0}.film span{height:7px;width:12px;background:#67776d;border-radius:2px}.film .used{background:#dfbd77}.puzzle-row{display:flex;align-items:center;gap:15px;border:1px solid var(--line);padding:12px;border-radius:9px;margin:8px 0;background:var(--paper)}.puzzle-row .num{font:30px Georgia;width:35px}.puzzle-row .text{flex:1}.paper{background:#fffdf5;max-width:600px;border:1px solid #d5cfbb;padding:35px;margin:20px auto;box-shadow:0 12px 30px #0001;text-align:center}.paper h2{font-size:39px;border-block:1px solid var(--accent);padding:15px 0}.paper p{font:16px/1.7 Georgia}.paper .columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;text-align:left}.theme{width:100%;margin:5px 0;display:flex;align-items:center;gap:12px}.swatch{width:28px;height:28px;border-radius:50%}.foot{text-align:center;font-size:11px;padding:24px;color:#738074}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#263e37;color:white;padding:14px 22px;border-radius:10px;z-index:10;max-width:90vw;box-shadow:0 10px 30px #0003}.guest .layout{display:block}.guest aside,.guest .workspace-head{display:none}.guest main{max-width:1200px;margin:auto}.guest .canvas{max-width:1000px}.save{font-size:11px;color:#66766c}dialog{border:1px solid var(--line);border-radius:15px;max-width:600px;width:90%;color:var(--ink);padding:30px}dialog::backdrop{background:#12251bb0}.check{display:flex;align-items:center;gap:10px;margin:12px 0}.check label{margin:0}.empty{text-align:center;padding:35px;color:#657569}video{max-width:100%;border-radius:10px}.quiz input{margin-bottom:8px}.hidden{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}aside nav{display:flex;overflow:auto}.step{white-space:nowrap;width:auto}.panel{margin-top:14px}main{padding:20px 12px}.hero{grid-template-columns:1fr}.hero-copy{padding:32px}.art{min-height:250px}.grid{grid-template-columns:1fr}.top{padding:15px}.workspace-head{align-items:flex-start}.section{padding:22px}.paper{padding:20px}.photos{grid-template-columns:repeat(2,1fr)}}@media print{body>*{display:none!important}#printarea{display:block!important}.paper{box-shadow:none;border:0;page-break-after:always;max-width:none}.paper:last-child{page-break-after:auto}@page{size:A4;margin:18mm}}\n\u003c/style>\n\u003cbody>\u003cheader class=\"top\">\u003cdiv class=\"brand\">conubia\u003ci>.\u003c/i> \u003cspan class=\"badge\">ATELIER DÉMO\u003c/span>\u003c/div>\u003cdiv class=\"top-actions\">\u003cspan id=\"save\" class=\"save\">Sauvegarde sur cet appareil\u003c/span>\u003cbutton id=\"mode\" onclick=\"toggleMode()\">Voir comme un invité ↗\u003c/button>\u003c/div>\u003c/header>\u003cdiv class=\"notice\">Événement fictif · Démonstration locale · Aucun compte, envoi, paiement ou publication en ligne\u003c/div>\u003cdiv class=\"layout\">\u003caside>\u003cp class=\"eyebrow\">Votre événement, à votre image\u003c/p>\u003cnav id=\"steps\">\u003c/nav>\u003cdiv id=\"panel\" class=\"panel\">\u003c/div>\u003cp class=\"save\" style=\"margin-top:30px\">Vos textes et réglages restent dans ce navigateur. Les photos importées sont temporaires.\u003c/p>\u003cbutton onclick=\"resetDemo()\" style=\"font-size:11px\">Réinitialiser la démo\u003c/button>\u003c/aside>\u003cmain>\u003cdiv class=\"workspace-head\">\u003cdiv>\u003cdiv class=\"eyebrow\">Un jour à vous\u003c/div>\u003ch2 style=\"margin-bottom:5px\">Imaginez. Personnalisez. Partagez.\u003c/h2>\u003cspan class=\"muted\" style=\"font-size:13px\">Vos choix prennent vie, juste ici.\u003c/span>\u003c/div>\u003cdiv class=\"row\">\u003cbutton onclick=\"mobile=false;render()\" aria-label=\"Aperçu ordinateur\">▱\u003c/button>\u003cbutton onclick=\"mobile=true;render()\" aria-label=\"Aperçu téléphone\">▯\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=\"canvas\" class=\"canvas\">\u003c/div>\u003c/main>\u003c/div>\u003cfooter class=\"foot\">Conubia · Préparez votre événement. Vivez chaque instant. Retrouvez tous vos souvenirs.\u003c/footer>\u003cdiv id=\"toast\" class=\"toast hidden\" role=\"status\">\u003c/div>\u003cdialog id=\"modal\">\u003c/dialog>\u003cdiv id=\"printarea\" class=\"hidden\">\u003c/div>\n\u003cscript>\n'use strict';\nconst BASE={names:'Camille & Sacha',date:'2027-06-19',place:'Le Jardin des Oliviers',welcome:'Une journée pour célébrer notre histoire. Et tous ceux qui en font partie.',theme:'olive',accent:'#496b57',modules:{programme:true,photos:true,jeux:true,papeterie:true},schedule:[['14:00','La cérémonie'],['16:00','Un verre au jardin'],['18:30','À table, ensemble'],['22:00','Sous les étoiles']],menu:'Burrata et tomates anciennes\\nRisotto aux légumes de saison\\nPavlova aux fruits rouges'};\nlet state;try{state={...structuredClone(BASE),...JSON.parse(localStorage.getItem('conubia-demo-v1')||'null')}}catch{state=structuredClone(BASE)}\nlet step='style',tab='accueil',mobile=false,guest=false,photos=[],cover='',attempts=0,best=0,started=0,stream=null,view='menu',paperPage=1,quizDone=false;\nlet order=[2,0,3,1];const memories=[['☕','Un premier café','2018'],['🚆','Le premier voyage','2019'],['🔑','Notre chez-nous','2021'],['💍','Un grand oui','2026']];const completed=new Set();\nconst $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction dateLabel(){const d=new Date(state.date+'T12:00:00');return isNaN(d)?'Date à choisir':d.toLocaleDateString('fr-BE',{day:'numeric',month:'long',year:'numeric'})}\nfunction notify(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}\nfunction save(){try{localStorage.setItem('conubia-demo-v1',JSON.stringify(state));$('save').textContent='✓ Réglages sauvegardés sur cet appareil'}catch{$('save').textContent='Sauvegarde indisponible — gardez cette page ouverte'}}\nfunction setValue(k,v){state[k]=v;save();renderCanvas()}\nfunction setTheme(t,c){state.theme=t;state.accent=c;save();render()}\nfunction go(t){stopCamera();tab=t;renderCanvas()}\nfunction toggleMode(){guest=!guest;document.body.classList.toggle('guest',guest);$('mode').textContent=guest?'← Revenir à mon atelier':'Voir comme un invité ↗';render()}\nfunction resetDemo(){if(!confirm('Effacer les réglages et souvenirs de cette démo ?'))return;state=structuredClone(BASE);photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];cover='';attempts=best=0;completed.clear();quizDone=false;save();render()}\nconst steps=[['style','01','Choisir une ambiance'],['infos','02','Raconter votre journée'],['modules','03','Composer l’expérience'],['papier','04','Créer vos supports']];\nfunction render(){document.documentElement.style.setProperty('--accent',state.accent);document.documentElement.style.setProperty('--soft',state.theme==='rose'?'#f3e7e4':state.theme==='night'?'#e5e8f1':'#e8eee5');$('steps').innerHTML=steps.map(([k,n,t])=>`\u003cbutton class=\"step ${step===k?'active':''}\" onclick=\"step='${k}';render()\">${n} &nbsp; ${t}\u003c/button>`).join('');\nif(step==='style')$('panel').innerHTML=`\u003ch3>Une ambiance qui vous ressemble.\u003c/h3>\u003cp class=\"muted\">Trois directions à essayer. Vos textes restent les mêmes.\u003c/p>${[['olive','Jardin méditerranéen','#496b57'],['rose','Romance poudrée','#975d68'],['night','Soirée contemporaine','#35486b']].map(([k,n,c])=>`\u003cbutton class=\"theme\" onclick=\"setTheme('${k}','${c}')\">\u003cspan class=\"swatch\" style=\"background:${c}\">\u003c/span>${n}${state.theme===k?' ✓':''}\u003c/button>`).join('')}\u003clabel for=\"color\">Votre couleur\u003c/label>\u003cinput id=\"color\" type=\"color\" value=\"${esc(state.accent)}\" onchange=\"state.accent=this.value;save();render()\">\u003clabel for=\"cover\">Photo de couverture (facultative)\u003c/label>\u003cinput id=\"cover\" type=\"file\" accept=\"image/jpeg,image/png,image/webp\" onchange=\"setCover(this.files[0])\">`;\nif(step==='infos')$('panel').innerHTML=`\u003ch3>Les détails qui comptent.\u003c/h3>\u003clabel for=\"names\">Vos prénoms\u003c/label>\u003cinput id=\"names\" maxlength=\"70\" value=\"${esc(state.names)}\" oninput=\"setValue('names',this.value)\">\u003clabel for=\"date\">Le grand jour\u003c/label>\u003cinput id=\"date\" type=\"date\" value=\"${esc(state.date)}\" onchange=\"setValue('date',this.value)\">\u003clabel for=\"place\">Le lieu\u003c/label>\u003cinput id=\"place\" maxlength=\"120\" value=\"${esc(state.place)}\" oninput=\"setValue('place',this.value)\">\u003clabel for=\"welcome\">Votre petit mot\u003c/label>\u003ctextarea id=\"welcome\" rows=\"3\" maxlength=\"350\" oninput=\"setValue('welcome',this.value)\">${esc(state.welcome)}\u003c/textarea>\u003clabel for=\"menu\">Menu · une ligne par plat\u003c/label>\u003ctextarea id=\"menu\" rows=\"3\" oninput=\"setValue('menu',this.value)\">${esc(state.menu)}\u003c/textarea>\u003clabel>Le programme\u003c/label>${state.schedule.map((s,i)=>`\u003cdiv class=\"row\" style=\"margin:8px 0\">\u003cinput aria-label=\"Horaire ${i+1}\" type=\"time\" value=\"${esc(s[0])}\" onchange=\"state.schedule[${i}][0]=this.value;save();renderCanvas()\">\u003cinput aria-label=\"Moment ${i+1}\" value=\"${esc(s[1])}\" oninput=\"state.schedule[${i}][1]=this.value;save();renderCanvas()\">\u003c/div>`).join('')}`;\nif(step==='modules')$('panel').innerHTML=`\u003ch3>À chacun sa fête.\u003c/h3>\u003cp class=\"muted\">Affichez uniquement ce qui vous est utile.\u003c/p>${Object.entries({programme:'Programme & menu',photos:'Pellicule & souvenirs',jeux:'Jeux & défis',papeterie:'Papeterie'}).map(([k,n])=>`\u003cdiv class=\"check\">\u003cinput type=\"checkbox\" id=\"m-${k}\" ${state.modules[k]?'checked':''} onchange=\"state.modules.${k}=this.checked;tab='accueil';save();renderCanvas()\">\u003clabel for=\"m-${k}\">${n}\u003c/label>\u003c/div>`).join('')}\u003cp class=\"save\">Les jeux et photos de cette démo ne sont partagés avec aucun autre appareil.\u003c/p>`;\nif(step==='papier')$('panel').innerHTML=`\u003ch3>Du lien au papier.\u003c/h3>\u003cp class=\"muted\">Les mêmes prénoms, couleurs et horaires sur vos supports.\u003c/p>\u003cbutton class=\"theme\" onclick=\"view='menu';go('papeterie')\">Menu de table\u003c/button>\u003cbutton class=\"theme\" onclick=\"view='gazette';paperPage=1;go('papeterie')\">Gazette · 4 pages\u003c/button>\u003cbutton class=\"theme\" onclick=\"view='livret';go('papeterie')\">Livret de cérémonie\u003c/button>\u003cbutton class=\"primary\" onclick=\"printPaper()\">Imprimer / enregistrer en PDF\u003c/button>\u003cp class=\"save\">Utilisez « Enregistrer au format PDF » dans la fenêtre d’impression. Les QR codes seront ajoutés après création d’un vrai lien d’événement.\u003c/p>`;renderCanvas()}\nfunction art(){return `\u003cdiv class=\"art\">${cover?`\u003cimg src=\"${cover}\" alt=\"Couverture choisie\">`:`\u003csvg viewBox=\"0 0 500 520\" aria-hidden=\"true\">\u003cdefs>\u003clinearGradient id=\"g\" x2=\"1\" y2=\"1\">\u003cstop stop-color=\"#d2dcca\"/>\u003cstop offset=\"1\" stop-color=\"#91a98c\"/>\u003c/linearGradient>\u003c/defs>\u003crect width=\"500\" height=\"520\" fill=\"url(#g)\"/>\u003cpath d=\"M60 550Q270 200 410 -50M-20 370Q220 300 470 220\" fill=\"none\" stroke=\"#647d5c\" stroke-width=\"4\"/>${Array.from({length:15},(_,i)=>`\u003cellipse cx=\"${80+i*25}\" cy=\"${460-i*32}\" rx=\"58\" ry=\"16\" transform=\"rotate(${i%2?35:-40} ${80+i*25} ${460-i*32})\" fill=\"${i%2?'#879e79':'#b3c3a7'}\"/>`).join('')}\u003ccircle cx=\"410\" cy=\"80\" r=\"100\" fill=\"#fff7df\" opacity=\".45\"/>\u003c/svg>`}\u003cdiv class=\"stamp\">${esc(state.names.split(/ & | et /)[0].trim().charAt(0))} \u003ci style=\"font-size:25px\">&\u003c/i> ${esc((state.names.split(/ & | et /)[1]||\" \").trim().charAt(0))}\u003csmall>UN JOUR À NOUS\u003c/small>\u003c/div>\u003c/div>`}\nfunction renderCanvas(){document.documentElement.style.setProperty('--accent',state.accent);$('canvas').className='canvas'+(mobile&&!guest?' mobile':'');const nav=[['accueil','Bienvenue'],...Object.entries({programme:'La journée',photos:'Les souvenirs',jeux:'À vous de jouer',papeterie:'Le papier'}).filter(([k])=>state.modules[k])];$('canvas').innerHTML=`\u003cdiv class=\"event-nav\">\u003cspan>${esc(state.names)}\u003c/span>\u003cspan>${dateLabel()}\u003c/span>\u003c/div>\u003cdiv class=\"event-tabs\">${nav.map(([k,n])=>`\u003cbutton class=\"${tab===k?'active':''}\" onclick=\"go('${k}')\">${n}\u003c/button>`).join('')}\u003c/div>${content()}\u003cdiv class=\"foot\">Créé avec amour · conubia.\u003c/div>`}\nfunction content(){if(tab==='accueil')return `\u003cdiv class=\"hero\">\u003cdiv class=\"hero-copy\">\u003cspan class=\"eyebrow\">Nous nous marions\u003c/span>\u003ch1>${esc(state.names)}\u003c/h1>\u003cp>${esc(state.welcome)}\u003c/p>\u003cp class=\"muted\">${dateLabel()}\u003cbr>${esc(state.place)}\u003c/p>\u003cbutton class=\"primary\" onclick=\"rsvp()\">Répondre à l’invitation\u003c/button>\u003c/div>${art()}\u003c/div>\u003cdiv class=\"section\">\u003cspan class=\"eyebrow\">Des instants à partager\u003c/span>\u003ch2>Vous faites partie de l’histoire.\u003c/h2>\u003cdiv class=\"grid\">${[['photos','◎','24 regards sur la fête','Une pellicule pour capturer les petits moments.'],['jeux','✧','Jouez ensemble','Défis, musique et souvenirs à remettre en ordre.'],['programme','◷','Profitez de la journée','Les horaires et le menu, à portée de main.']].filter(([k])=>state.modules[k]).map(([k,s,t,d])=>`\u003cdiv class=\"card\">\u003cdiv class=\"symbol\">${s}\u003c/div>\u003ch3>${t}\u003c/h3>\u003cp>${d}\u003c/p>\u003cbutton onclick=\"go('${k}')\">Découvrir →\u003c/button>\u003c/div>`).join('')}\u003c/div>\u003c/div>`;\nif(tab==='programme')return `\u003cdiv class=\"section\">\u003cspan class=\"eyebrow\">${dateLabel()}\u003c/span>\u003ch2>Le fil de notre journée.\u003c/h2>\u003cdiv class=\"timeline\">${state.schedule.map(s=>`\u003carticle>\u003ctime>${esc(s[0])}\u003c/time>\u003ch3>${esc(s[1])}\u003c/h3>\u003cspan class=\"muted\">${esc(state.place)}\u003c/span>\u003c/article>`).join('')}\u003c/div>\u003cdiv class=\"card\">\u003cspan class=\"eyebrow\">À notre table\u003c/span>\u003ch2>Un menu à savourer.\u003c/h2>${state.menu.split('\\n').map(s=>`\u003cp>${esc(s)}\u003c/p>`).join('')}\u003c/div>\u003c/div>`;\nif(tab==='photos')return `\u003cdiv class=\"section\">\u003cspan class=\"eyebrow\">Les souvenirs\u003c/span>\u003ch2>Les plus beaux moments sont aussi les vôtres.\u003c/h2>\u003cdiv class=\"camera\">\u003cdiv class=\"row\" style=\"justify-content:space-between\">\u003cspan>PEL. 01\u003c/span>\u003cb>${photos.filter(p=>p.film).length} / 24\u003c/b>\u003c/div>\u003cdiv class=\"film\">${Array.from({length:24},(_,i)=>`\u003cspan class=\"${i\u003cphotos.filter(p=>p.film).length?'used':''}\">\u003c/span>`).join('')}\u003c/div>\u003cdiv id=\"cameraView\" class=\"lens\">\u003cspan style=\"font-size:45px\">◎\u003c/span>\u003cspan>Un instant. Votre regard.\u003c/span>\u003c/div>\u003cdiv class=\"row\" style=\"margin-top:15px\">\u003cbutton onclick=\"startCamera()\" ${photos.filter(p=>p.film).length>=24?'disabled':''}>Ouvrir l’appareil\u003c/button>\u003cbutton onclick=\"samplePhoto()\" ${photos.filter(p=>p.film).length>=24?'disabled':''}>Essayer avec une illustration\u003c/button>\u003c/div>\u003cp style=\"font-size:11px\">Démo : photos conservées en mémoire dans cet onglet, sans envoi. L’import ci-dessous ne consomme pas la pellicule.\u003c/p>\u003c/div>\u003clabel for=\"upload\">Ajouter des photos existantes\u003c/label>\u003cinput id=\"upload\" type=\"file\" accept=\"image/jpeg,image/png,image/webp\" multiple onchange=\"importPhotos(this.files)\">${photos.length?`\u003cdiv class=\"photos\">${photos.map((p,i)=>`\u003cdiv class=\"photo\">\u003cimg src=\"${p.url}\" alt=\"Souvenir ${i+1}\">\u003cp>${p.film?'Pellicule':'Import'} · local uniquement \u003ca href=\"${p.url}\" download=\"souvenir-${i+1}.${p.ext||'jpg'}\">Télécharger\u003c/a>\u003c/p>\u003c/div>`).join('')}\u003c/div>`:'\u003cp class=\"empty\">Votre album attend ses premiers souvenirs.\u003c/p>'}\u003c/div>`;\nif(tab==='jeux')return `\u003cdiv class=\"section\">\u003cspan class=\"eyebrow\">Petits défis, grands souvenirs\u003c/span>\u003ch2>La fête se joue ensemble.\u003c/h2>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003cdiv class=\"symbol\">♫\u003c/div>\u003ch3>Hit & Kiss\u003c/h3>\u003cp>Titre, artiste, année. Un quiz piloté par l’animateur.\u003c/p>\u003cbutton onclick=\"quiz()\">Essayer une manche\u003c/button>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"symbol\">▦\u003c/div>\u003ch3>Notre histoire\u003c/h3>\u003cp>Recomposez la chronologie. 3 tentatives, meilleur résultat conservé.\u003c/p>\u003cbutton onclick=\"puzzle()\">Jouer au puzzle\u003c/button>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"symbol\">✧\u003c/div>\u003ch3>Défis photo\u003c/h3>\u003cp>Une occasion de rencontrer, rire et créer ensemble.\u003c/p>\u003cbutton onclick=\"challenges()\">Choisir un défi\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"save\">Version d’essai : puzzle de 4 souvenirs fictifs, classement local et aucune récompense réelle. Le jeu historique de 21 photos est conservé dans le projet d’origine.\u003c/p>\u003c/div>`;\nif(tab==='papeterie')return `\u003cdiv class=\"section\">\u003cdiv class=\"row\">\u003cbutton onclick=\"view='menu';renderCanvas()\">Menu\u003c/button>\u003cbutton onclick=\"view='gazette';renderCanvas()\">Gazette\u003c/button>\u003cbutton onclick=\"view='livret';renderCanvas()\">Livret\u003c/button>\u003cbutton class=\"primary\" onclick=\"printPaper()\">Imprimer / PDF\u003c/button>\u003c/div>${view==='gazette'?`\u003cp>Page ${paperPage} / 4 &nbsp; ${[1,2,3,4].map(n=>`\u003cbutton onclick=\"paperPage=${n};renderCanvas()\">${n}\u003c/button>`).join('')}\u003c/p>`:''}${paper(view,paperPage)}\u003c/div>`;return ''}\nfunction paper(kind,page=1){let body='';if(kind==='menu')body=`\u003cspan class=\"eyebrow\">À notre table\u003c/span>\u003ch2>Le menu\u003c/h2>${state.menu.split('\\n').map(s=>`\u003cp>${esc(s)}\u003c/p>`).join('\u003cp>✧\u003c/p>')}`;if(kind==='livret')body=`\u003cspan class=\"eyebrow\">Livret · exemple de cérémonie laïque\u003c/span>\u003ch2>Célébrer notre histoire\u003c/h2>${['Bienvenue à nos proches','Entrée du couple','Lecture par un proche','Échange des vœux','Échange des alliances','Un nouveau chapitre'].map((s,i)=>`\u003cp>${i+1}. ${s}\u003c/p>`).join('')}\u003cp>\u003csmall>Textes et musiques à personnaliser dans la future version.\u003c/small>\u003c/p>`;if(kind==='gazette')body=page===1?`\u003cspan class=\"eyebrow\">Édition spéciale · ${dateLabel()}\u003c/span>\u003ch2>La Gazette\u003cbr>des amoureux\u003c/h2>\u003cp style=\"font-size:28px\">${esc(state.names)} se disent oui.\u003c/p>\u003cp>${esc(state.welcome)}\u003c/p>\u003cp>Rendez-vous à ${esc(state.place)}.\u003c/p>`:page===2?`\u003ch2>La journée\u003c/h2>${state.schedule.map(s=>`\u003cp>\u003cb>${esc(s[0])}\u003c/b> · ${esc(s[1])}\u003c/p>`).join('')}`:page===3?`\u003ch2>À vous de jouer\u003c/h2>\u003cp>Qui a fait le premier pas ?\u003c/p>\u003cp>Qui choisit toujours la musique ?\u003c/p>\u003cp>Qui prépare les meilleures surprises ?\u003c/p>\u003chr>\u003cp>Votre défi : réunir trois générations sur une photo.\u003c/p>`:`\u003ch2>Merci d’être là.\u003c/h2>\u003cp>Vous avez donné à cette journée sa plus belle couleur.\u003c/p>\u003cp>Un petit mot pour le couple :\u003c/p>\u003cp>________________________\u003c/p>\u003cp>________________________\u003c/p>\u003cp>________________________\u003c/p>`;return `\u003carticle class=\"paper\" style=\"color:${esc(state.accent)}\">\u003cp>${esc(state.names)}\u003c/p>${body}\u003cp style=\"font-size:12px\">${dateLabel()} · ${esc(state.place)}${kind==='gazette'?' · '+page+'/4':''}\u003c/p>\u003c/article>`}\nfunction printPaper(){$('printarea').innerHTML=view==='gazette'?[1,2,3,4].map(n=>paper('gazette',n)).join(''):paper(view);window.print()}\nfunction modal(html){$('modal').innerHTML=`\u003cbutton style=\"float:right\" onclick=\"$('modal').close()\" aria-label=\"Fermer\">✕\u003c/button>${html}`;if(!$('modal').open)$('modal').showModal()}\nfunction rsvp(){modal(`\u003cspan class=\"eyebrow\">Réponse de démonstration\u003c/span>\u003ch2>Vous serez des nôtres ?\u003c/h2>\u003cform onsubmit=\"event.preventDefault();$('modal').close();notify('Réponse simulée : aucun message envoyé aux organisateurs.')\">\u003clabel for=\"r-name\">Votre prénom\u003c/label>\u003cinput id=\"r-name\" required maxlength=\"60\">\u003clabel for=\"r-answer\">Votre réponse\u003c/label>\u003cselect id=\"r-answer\">\u003coption>Avec plaisir !\u003c/option>\u003coption>Je ne pourrai pas venir\u003c/option>\u003c/select>\u003cp class=\"save\">Ce formulaire sert uniquement à essayer le parcours.\u003c/p>\u003cbutton class=\"primary\">Confirmer ma réponse d’essai\u003c/button>\u003c/form>`)}\nfunction puzzle(){if(attempts>=3){modal(`\u003ch2>Bravo !\u003c/h2>\u003cp>Vos trois tentatives sont utilisées.\u003c/p>\u003cp>Meilleur résultat : ${best}/4.\u003c/p>`);return}order=[2,0,3,1];started=Date.now();drawPuzzle()}\nfunction drawPuzzle(){modal(`\u003cspan class=\"eyebrow\">Essai ${attempts+1}/3 · démo courte\u003c/span>\u003ch2>Chaque souvenir à sa place.\u003c/h2>\u003cp>Du plus ancien au plus récent. Utilisez les flèches pour déplacer les cartes.\u003c/p>${order.map((id,i)=>`\u003cdiv class=\"puzzle-row\">\u003cspan class=\"num\">${memories[id][0]}\u003c/span>\u003cspan class=\"text\">${memories[id][1]}\u003c/span>\u003cbutton aria-label=\"Monter ${memories[id][1]}\" onclick=\"moveCard(${i},-1)\" ${i===0?'disabled':''}>↑\u003c/button>\u003cbutton aria-label=\"Descendre ${memories[id][1]}\" onclick=\"moveCard(${i},1)\" ${i===3?'disabled':''}>↓\u003c/button>\u003c/div>`).join('')}\u003cbutton class=\"primary\" onclick=\"submitPuzzle()\">Valider cet ordre\u003c/button>\u003cp class=\"save\">Meilleur résultat : ${best}/4. Scores locaux à cette session.\u003c/p>`)}\nfunction moveCard(i,d){const j=i+d;if(j\u003c0||j>=4)return;[order[i],order[j]]=[order[j],order[i]];drawPuzzle()}\nfunction submitPuzzle(){const score=order.filter((id,i)=>id===i).length;attempts++;best=Math.max(best,score);modal(`\u003ch2>${score===4?'Une histoire bien reconstituée !':'Chaque souvenir compte.'}\u003c/h2>\u003cp>${score}/4 bien placés · ${Math.floor((Date.now()-started)/1000)} secondes.\u003c/p>\u003cp>Meilleur résultat : ${best}/4 · ${attempts}/3 essais.\u003c/p>${attempts\u003c3?'\u003cbutton class=\"primary\" onclick=\"puzzle()\">Retenter\u003c/button>':'\u003cp>Merci d’avoir joué !\u003c/p>'}`)}\nfunction challenges(){modal(`\u003ch2>Votre mission, si vous l’acceptez…\u003c/h2>${['Réunir trois générations','Capturer un fou rire','Photographier le détail que personne ne voit'].map((s,i)=>`\u003cdiv class=\"card\" style=\"margin:10px 0\">\u003cb>${s}\u003c/b>\u003cp>Défi créatif · sans points dans cette démo.\u003c/p>\u003cbutton onclick=\"completed.add(${i});challenges()\" ${completed.has(i)?'disabled':''}>${completed.has(i)?'✓ Marqué comme réalisé':'Marquer réalisé (simulation)'}\u003c/button>\u003c/div>`).join('')}`)}\nfunction quiz(){modal(`\u003cspan class=\"eyebrow\">Hit & Kiss · manche fictive sans audio\u003c/span>\u003ch2>À vous de reconnaître…\u003c/h2>\u003cp>Pour tester la correction, saisissez : \u003cb>Notre été\u003c/b>, \u003cb>Les Lucioles\u003c/b>, \u003cb>2024\u003c/b>. Titre : 1 point ; artiste : 1 ; année : 2. La vitesse n’ajoute pas de points.\u003c/p>\u003cform class=\"quiz\" onsubmit=\"event.preventDefault();scoreQuiz(this)\">\u003clabel for=\"q1\">Titre\u003c/label>\u003cinput id=\"q1\" name=\"title\" required>\u003clabel for=\"q2\">Artiste\u003c/label>\u003cinput id=\"q2\" name=\"artist\" required>\u003clabel for=\"q3\">Année\u003c/label>\u003cinput id=\"q3\" name=\"year\" inputmode=\"numeric\" required>\u003cbutton class=\"primary\">Valider les réponses\u003c/button>\u003c/form>\u003cp class=\"save\">Cette manche illustre les règles auditées. Aucun morceau commercial n’est utilisé.\u003c/p>`)}\nfunction scoreQuiz(f){const norm=s=>s.trim().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase();const score=+(norm(f.title.value)==='notre ete')+ +(norm(f.artist.value)==='les lucioles')+2*(f.year.value.trim()==='2024');modal(`\u003ch2>${score}/4 points\u003c/h2>\u003cp>Correction : Notre été · Les Lucioles · 2024.\u003c/p>\u003cp>Résultat de démonstration, séparé du puzzle et des défis.\u003c/p>`)}\nfunction setCover(f){if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){notify('Choisissez une photo JPG, PNG ou WebP.');return}if(cover)URL.revokeObjectURL(cover);cover=URL.createObjectURL(f);renderCanvas()}\nfunction importPhotos(files){for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>15*1024*1024){notify('Photo ignorée : utilisez JPG, PNG ou WebP, moins de 15 Mo.');continue}photos.push({url:URL.createObjectURL(f),film:false,ext:f.type.split('/')[1]})}renderCanvas()}\nfunction addPhoto(url,ext='jpg'){if(photos.filter(p=>p.film).length>=24){notify('Votre pellicule est complète.');return}photos.push({url,film:true,ext});stopCamera();renderCanvas();notify('Photo gardée dans la démo locale. Aucun envoi effectué.')}\nfunction samplePhoto(){const svg=`\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"600\" height=\"450\">\u003crect width=\"600\" height=\"450\" fill=\"${state.accent}\"/>\u003ccircle cx=\"300\" cy=\"180\" r=\"70\" fill=\"#eadcb5\"/>\u003cpath d=\"M0 450Q150 100 300 350Q450 180 600 450\" fill=\"#8ba080\"/>\u003ctext x=\"300\" y=\"400\" fill=\"white\" text-anchor=\"middle\" font-size=\"25\" font-family=\"Georgia\">Un souvenir illustré · démo\u003c/text>\u003c/svg>`;addPhoto(URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),'svg')}\nfunction stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}\nasync function startCamera(){if(photos.filter(p=>p.film).length>=24)return;try{if(!navigator.mediaDevices?.getUserMedia)throw Error();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});if(tab!=='photos'){stopCamera();return}$('cameraView').style.height='auto';$('cameraView').innerHTML='\u003cvideo id=\"video\" autoplay playsinline muted>\u003c/video>\u003cbutton onclick=\"capture()\">Prendre la photo\u003c/button>\u003cbutton onclick=\"stopCamera();renderCanvas()\">Fermer la caméra\u003c/button>';$('video').srcObject=stream}catch{notify('Caméra indisponible ou refusée. Importez une photo ou essayez l’illustration.')}}\nfunction capture(){const v=$('video');if(!v?.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(blob=>{if(!blob)return;stopCamera();const url=URL.createObjectURL(blob);modal(`\u003ch2>On la garde ?\u003c/h2>\u003cimg src=\"${url}\" alt=\"Photo à confirmer\" style=\"width:100%;border-radius:10px\">\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"keep\">Garder\u003c/button>\u003cbutton id=\"discard\">Reprendre\u003c/button>\u003c/div>`);$('keep').onclick=()=>{$('modal').close();addPhoto(url)};$('discard').onclick=()=>{URL.revokeObjectURL(url);$('modal').close();startCamera()}},'image/jpeg',.9)}\nwindow.addEventListener('beforeunload',stopCamera);render();\n\u003c/script>\u003c/body>\u003c/html>\n"</script>

function renderLeft(){let h='',desc='',body='';if(pane==='layers'){h='Votre page';desc='Glissez les sections pour les réorganiser. Ou sélectionnez-les dans la page.';body=`<div class="group-label">${state.blocks.length} sections · accueil</div>${state.blocks.map((b,i)=>`<div class="layer ${selected===b.id?'selected':''}" draggable="true" data-layer="${b.id}" ondragstart="dragged='${b.id}'" ondragover="event.preventDefault();this.classList.add('dropover')" ondragleave="this.classList.remove('dropover')" ondrop="event.preventDefault();dropLayer('${b.id}')"><span style="color:#a3ada0">⠿</span>${icon(TYPES[b.type][1])}<div class="label" tabindex="0" role="button" onclick="focusBlock('${b.id}')" onkeydown="if(event.key==='Enter')focusBlock('${b.id}')">${esc(TYPES[b.type][0])}<small>${esc((b.title||'Un peu de respiration').replace(/\n/g,' ').slice(0,26))}${b.hidden?' · masquée':''}</small></div><button aria-label="Sélectionner ${TYPES[b.type][0]}" onclick="focusBlock('${b.id}')">›</button></div>`).join('')}<button class="add-tile" onclick="setPane('blocks')" style="justify-content:center;border-style:dashed;margin-top:18px">${icon('plus')} Ajouter une section</button><p class="tiny">La page et les réglages sont sauvegardés localement. Aucun site n’est publié.</p>`}

if(pane==='style'){h='L’identité de votre fête';desc='Ces réglages s’appliquent à toute la page et aux supports de la démo.';body=`<div class="settings" style="padding:0"><label>Couleur principale</label><div class="row"><input type="color" aria-label="Couleur principale" value="${state.accent}" onchange="setGlobal('accent',this.value)"><span class="tiny">${state.accent}</span></div><label>Fond de la page</label><div class="row"><input type="color" aria-label="Fond de la page" value="${state.bg}" onchange="setGlobal('bg',this.value)"><span class="tiny">${state.bg}</span></div><label>Couleur du texte</label><div class="row"><input type="color" aria-label="Couleur du texte" value="${state.text}" onchange="setGlobal('text',this.value)"><span class="tiny">${state.text}</span></div><label for="font">Typographie des titres</label><select id="font" onchange="setGlobal('font',this.value)">${[['ConubiaEditorial, serif','Éditorial · Roman Display'],['ConubiaModern, serif','Festif · Sans Condensed'],['ConubiaBotanical, serif','Botanique · Roman Italic'],['ConubiaMinimal, serif','Minimal · Sans Light'],['ConubiaBohemian, serif','Bohème · Roman Dunhill'],['Georgia, serif','Classique · Georgia'],['Arial, sans-serif','Moderne · Arial'],['Palatino Linotype, serif','Littéraire · Palatino'],['Trebuchet MS, sans-serif','Convivial · Trebuchet']].map(([v,n])=>`<option value="${v}" ${state.font===v?'selected':''}>${n}</option>`).join('')}</select><div class="setting-section"><button class="theme-reset" onclick="previewTemplate(state.template)">Revenir au style du modèle</button></div></div>`}
