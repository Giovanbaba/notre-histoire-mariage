<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Conubia · Atelier des mariés</title><style>:root{--bg:#faf8f1;--text:#233e35;--accent:#233e35}*{box-sizing:border-box}body{margin:0;background:#f3f3ed;color:#233e35;font:15px/1.6 system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a.btn{cursor:pointer;border:1px solid #cbd3c5;border-radius:9px;padding:10px 16px;background:white;color:#233e35;text-decoration:none;display:inline-block}button:hover{background:#edf0e6}.primary{background:#233e35;color:white}button:disabled{opacity:.5;cursor:wait}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd3c5;border-radius:7px;background:#fff;color:#233e35}label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}header{padding:25px 5%;background:white;border-bottom:1px solid #dde1d8;display:flex;justify-content:space-between;align-items:center;gap:20px}header b{font:30px Georgia}nav{display:flex;gap:8px;flex-wrap:wrap;padding:20px 5%;background:#fff}nav .active{background:#233e35;color:white}main{max-width:1150px;margin:auto;padding:35px 25px}h1,h2,h3{line-height:1.15}h1{font:46px Georgia;margin:0 0 15px}h2{font:28px Georgia}h3{font:22px Georgia}.muted{color:#647462;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{padding:25px;background:white;border:1px solid #dce2d5;border-radius:14px;margin-bottom:20px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}.stats .card{margin:0}.stats b{display:block;font:38px Georgia}.tag{display:inline-block;font-size:11px;padding:5px 10px;background:#edf0df;border-radius:20px}.person{display:grid;grid-template-columns:1.2fr .7fr 1.4fr auto;gap:10px;margin:10px 0;align-items:end}.person label{margin-top:0}.notice{background:#f0ecd7;padding:15px 20px;border-radius:8px;font-size:13px}.error{color:#a02626}#status{padding:0 5%;font-size:14px;min-height:24px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:13px 10px;border-bottom:1px solid #dde1d5;vertical-align:top}.scroll{overflow:auto}.song{border-top:1px solid #dde1d5;padding:18px 0}.song summary{cursor:pointer;display:flex;justify-content:space-between;gap:15px}.sheet{background:var(--bg);color:var(--text);padding:55px 45px;min-height:650px;text-align:center;font-family:Georgia;border:1px solid currentColor}.sheet h1{font-size:42px}.sheet p{white-space:pre-line}.sheet .courses{font-size:20px;line-height:2.3;margin:40px 0}.sheet[data-theme=poster]{font-family:Impact,system-ui;text-transform:uppercase;border:8px solid}.sheet[data-theme=disco]{border-radius:70px 0}.sheet[data-theme=travel]{font-family:monospace;border:3px dashed}.sheet[data-theme=romance]{border:4px double;border-radius:160px 160px 0 0}.sheet[data-theme=floral],.sheet[data-theme=bohemian]{border-radius:180px 180px 0 0}.sheet[data-theme=minimal]{text-align:left;border:0}.sheet .ornament{font:60px Georgia;line-height:1;color:var(--accent)}.check{display:flex;align-items:start;gap:10px}.check input{width:auto;margin-top:5px}canvas{max-width:100%;height:auto}a{color:#345e4c}audio{max-width:100%}.guest-wrap{max-width:760px;margin:30px auto;padding:0 20px}body.guest{background:var(--bg);color:var(--text)}.guest h1{text-align:center}.guest .card{color:#233e35}.guest header{background:transparent;color:var(--text)}.success{padding:25px;background:#e6f0df;border-radius:15px}.pack-icon{font-size:32px}.print-only{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.person{grid-template-columns:1fr 1fr}.person>div:nth-child(3){grid-column:1/-1}h1{font-size:35px}main{padding:25px 15px}.card{padding:20px}header{align-items:start;flex-wrap:wrap}.sheet{padding:45px 20px}nav{gap:5px}nav button{font-size:12px;padding:8px}}@media print{body>*{display:none!important}body>.print-only{display:block!important}.sheet{width:148mm;min-height:210mm;page-break-after:always;margin:auto}body{background:white}@page{margin:10mm}}
</style></head><body><header><b>conubia. / atelier</b><span>Vos invités, vos créations, votre fête.</span></header><nav aria-label="Ateliers"></nav><p id="status" role="status" aria-live="polite"></p><main id="body"></main><dialog id="testDialog"></dialog><script src="/conubia/atelier/qr.js"></script><script>const SEED=[{"id":1,"title":"Move","artists":["Adam Port","Stryv","Keinemusik","Orso","Malachiii"],"years":["2024"],"titleAliases":[],"artistAliases":["adam port","stryv","keinemusik"]},{"id":2,"title":"Billie Jean","artists":["Michael Jackson"],"years":["1982","1983"],"titleAliases":["billy jean","bili jean","billie jeans"],"artistAliases":["michael","jackson","mickael jakson","michael jakson","mickael jackson"]},{"id":3,"title":"Les Démons de minuit","artists":["Images"],"years":["1986"],"titleAliases":["demons de minuit"],"artistAliases":[]},{"id":4,"title":"Freed from Desire","artists":["Gala"],"years":["1996"],"titleAliases":["free from desire"],"artistAliases":[]},{"id":5,"title":"Alors on danse","artists":["Stromae"],"years":["2009"],"titleAliases":[],"artistAliases":[]},{"id":6,"title":"I Gotta Feeling","artists":["The Black Eyed Peas"],"years":["2009"],"titleAliases":["gotta feeling"],"artistAliases":["black eyed peas","bep"]},{"id":7,"title":"Smalltown Boy","artists":["Bronski Beat"],"years":["1984"],"titleAliases":["small town boy"],"artistAliases":["bronski"]},{"id":8,"title":"Oh, Pretty Woman","artists":["Roy Orbison"],"years":["1964"],"titleAliases":["pretty woman"],"artistAliases":["roy","orbison"]},{"id":9,"title":"A Whiter Shade of Pale","artists":["Procol Harum"],"years":["1967"],"titleAliases":["whiter shade"],"artistAliases":["procol arum"]},{"id":10,"title":"Dancing Queen","artists":["ABBA"],"years":["1976"],"titleAliases":[],"artistAliases":[]},{"id":11,"title":"Born to Be Alive","artists":["Patrick Hernandez"],"years":["1978","1979"],"titleAliases":["born alive"],"artistAliases":[]},{"id":12,"title":"D.A.N.C.E.","artists":["Justice"],"year itleAliases":["sweet dreams"],"artistAliases":["eurythmics"]},{"id":28,"title":"Noche de Sexo","artists":["Wisin & Yandel","Aventura"],"years":["2005"],"titleAliases":["noche sexo"],"artistAliases":["wisin","yandel","aventura"]},{"id":29,"title":"(When You Gonna) Give It Up to Me","artists":["Sean Paul","Keyshia Cole"],"years":["2005","2006"],"titleAliases":["give it up to me"],"artistAliases":["sean paul"]},{"id":30,"title":"Mambo No. 5 (A Little Bit of…)","artists":["Lou Bega"],"years":["1999"],"titleAliases":["mambo 5"],"artistAliases":["lou bega"]},{"id":31,"title":"No Scrubs","artists":["TLC"],"years":["1999"],"titleAliases":[],"artistAliases":[]},{"id":32,"title":"I Want It That Way","artists":["Backstreet Boys"],"years":["1999"],"titleAliases":["i want it"],"artistAliases":["backstreet boys","bsb"]},{"id":33,"title":"Tití Me Preguntó","artists":["Bad Bunny"],"years":["2022"],"titleAliases":["titi me pregunto"],"artistAliases":["bad bunny"]},{"id":34,"title":"Ma Benz","artists":["Suprême NTM","Lord Kossity"],"years":["1998"],"titleAliases":["benz"],"artistAliases":["ntm","supreme ntm"]}];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='conubia-planner-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{};data=data||{menu:'Apéritif\nLes bouchées du jardin\n\nEntrée\nBurrata et tomates anciennes\n\nPlat\nRisotto de saison\n\nDessert\nPavlova aux fruits rouges',message:'Nous serions heureux de partager cette journée avec vous.',songs:structuredClone(SEED),pack:{}};
let context={names:'Camille & Sacha',date:'2027-06-19',place:'Le Jardin des Oliviers',bg:'#faf8f1',text:'#233e35',accent:'#233e35',theme:'editorial'};try{Object.assign(context,JSON.parse(localStorage.getItem('conubia-planner-context')||'{}'))}catch{}
let view=new URLSearchParams(location.search).get('tab')||'guests',rows=[],recorder,stream,recordTimer,audioURL;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function status(t,error=false){$('status').textContent=t;$('status').className=error?'error':''}function setView(v){stopAudio();view=v;render()}
const views={guests:'Invités & présences',paper:'Menu & invitations',gazette:'Gazette',music:'Hit & Kiss',pack:'Pack souvenirs'};
function render(){document.querySelector('nav').innerHTML=Object.entries(views).map(([k,n])=>`<button class="${view===k?'active':''}" onclick="setView('${k}')">${n}</button>`).join('');$('body').innerHTML=({guests:guests,paper:paper,gazette:gazette,music:music,pack:pack}[view]||guests)();if(view==='guests'&&data.remote)loadResponses();if(view==='guests'&&data.remote)drawQR()}
function guests(){return `<h1>Tout le monde autour de vous.</h1><p>Une invitation par famille. Une vue d’ensemble pour préparer la fête.</p><div class="grid"><section class="card"><h2>L’invitation en ligne</h2><p class="muted">Le formulaire demande les noms, la présence, les adultes, les enfants et les allergies de chaque personne. Les réponses restent privées.</p><label>Votre message</label><textarea rows="4" onchange="data.message=this.value;save()">${esc(data.message)}</textarea><div class="row" style="margin-top:20px"><button class="primary" onclick="publishInvitation(this)">${data.remote?'Mettre à jour l’invitation':'Créer le lien invités'}</button><button onclick="exportAdmin()">Sauvegarder mon accès admin</button></div><p class="muted">Conservez la sauvegarde admin : elle permet de retrouver les réponses depuis un autre appareil. Ne l’envoyez pas aux invités.</p><label>Restaurer mon accès admin<input type="file" accept="application/json" onchange="importAdmin(this.files[0])"></label></section><section class="card"><h2>Le QR code des invités</h2>${data.remote?`<canvas id="qr"></canvas><p class="muted">Ce lien donne accès au formulaire, jamais au tableau des réponses.</p><input aria-label="Lien invités" readonly value="${esc(guestLink())}"><div class="row" style="margin-top:15px"><button onclick="copyLink()">Copier le lien</button><button onclick="downloadQR()">Télécharger le QR</button><a class="btn" href="${esc(guestLink())}" target="_blank" rel="noopener noreferrer">Ouvrir l’invitation</a></div>`:'<p>Le QR sera généré après la création du lien invités.</p>'}</section></div><section id="summary"><div class="notice">${data.remote?'Chargement des réponses…':'Créez votre invitation pour commencer à recevoir des réponses.'}</div></section>`}
function guestLink(){return location.origin+'/conubia/invitation/?event='+data.remote.id+'#k='+data.remote.guest}
async function api(path,method='GET',body,admin=true){const r=await fetch('/api/conubia/events'+path,{method,headers:{'Content-Type':'application/json',...(data.remote?{Authorization:'Bearer '+(admin?data.remote.admin:data.remote.guest)}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Service indisponible');return j}
async function publishInvitation(btn){btn.disabled=true;try{const payload={...context,message:data.message};if(data.remote)await api('/'+data.remote.id,'PUT',payload);else data.remote=await api('','POST',payload);save();render();status('Invitation disponible. Vous pouvez partager le lien ou le QR code.')}catch(e){status(e.message,true);btn.disabled=false}}
async function drawQR(){try{await QRCode.toCanvas($('qr'),guestLink(),{width:250,margin:3,errorCorrectionLevel:'M'})}catch{status('Le QR code n’a pas pu être généré.',true)}}
async function copyLink(){try{await navigator.clipboard.writeText(guestLink());status('Lien invités copié.')}catch{status('Copiez le lien dans le champ ci-dessus.')}}
function downloadQR(){download($('qr').toDataURL('image/png'),'conubia-qr-invites.png')}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click();if(url.startsWith('blob:'))setTimeout(()=>URL.revokeObjectURL(url),1000)}
function jsonDownload(obj,name){download(URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),name)}
function exportAdmin(){jsonDownload({version:1,context,data},'conubia-acces-prive-maries.json')}
async function importAdmin(f){if(!f)return;try{const j=JSON.parse(await f.text());if(!j.data||!Array.isArray(j.data.songs)||!j.context)throw Error('Fichier invalide');data=j.data;context=j.context;save();render();status('Projet restauré.')}catch(e){status(e.message,true)}}
async function loadResponses(){try{rows=(await api('/'+data.remote.id+'/responses')).rows;const yes=rows.filter(r=>r.attending==='yes'),people=yes.flatMap(r=>r.people),adults=people.filter(p=>p.kind==='adult').length,children=people.length-adults,allergic=people.filter(p=>p.allergies.trim());if(!$('summary'))return;$('summary').innerHTML=`<h2>Le bilan des mariés</h2><div class="stats">${[[people.length,'Invités confirmés'],[adults,'Adultes'],[children,'Enfants'],[allergic.length,'Personnes avec allergies / restrictions']].map(([n,t])=>`<div class="card"><b>${n}</b>${t}</div>`).join('')}</div><p>${yes.length} familles présentes · ${rows.length-yes.length} familles absentes · ${rows.length} réponses reçues</p><div class="card"><h3>Allergies et restrictions déclarées</h3>${allergic.length?allergic.map(p=>`<p><b>${esc(p.name)}</b> : ${esc(p.allergies)}</p>`).join(''):'Aucune déclaration pour le moment.'}</div><p class="muted">Une personne peut déclarer plusieurs allergies. Les absents sont exclus des totaux. Les familles n’ayant pas répondu ne sont pas encore recensées.</p><div class="row"><button onclick="loadResponses()">Actualiser</button><button onclick="exportResponses()">Exporter les réponses CSV</button></div><div class="card scroll" style="margin-top:20px"><table><thead><tr><th>Famille</th><th>Présence</th><th>Invités et allergies</th><th>Message</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.family)}</td><td>${r.attending==='yes'?'Présents':'Absents'}</td><td>${r.people.map(p=>`${esc(p.name)} · ${p.kind==='child'?'enfant':'adulte'}${p.allergies?' — '+esc(p.allergies):''}`).join('<br>')||'—'}</td><td>${esc(r.note)}</td></tr>`).join('')||'<tr><td colspan="4">Aucune réponse pour le moment.</td></tr>'}</tbody></table></div>`}catch(e){status(e.message,true);if($('summary'))$('summary').textContent='Les réponses ne sont pas disponibles. Réessayez avec Actualiser.'}}
function exportResponses(){const csv=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const out=[['Famille','Présence','Prénom','Catégorie','Allergies','Message'],...rows.flatMap(r=>(r.people.length?r.people:[{}]).map(p=>[r.family,r.attending==='yes'?'Oui':'Non',p.name,p.kind==='child'?'Enfant':p.kind==='adult'?'Adulte':'',p.allergies,r.note]))].map(a=>a.map(csv).join(';')).join('\r\n');download(URL.createObjectURL(new Blob(['\ufeff'+out],{type:'text/csv;charset=utf-8'})),'conubia-invites.csv')}
function sheet(kind){return `<article class="sheet" data-theme="${esc(context.theme)}" style="--bg:${esc(context.bg)};--text:${esc(context.text)};--accent:${esc(context.accent)}"><div class="ornament">&</div><p>${esc(context.names)}</p><h1>${kind==='menu'?'Le menu':'Vous êtes invités'}</h1><p>${esc(context.date)} · ${esc(context.place)}</p><div class="courses">${esc(kind==='menu'?data.menu:data.message)}</div>${kind==='invite'&&data.remote?'<p>Répondez via le QR code joint à votre invitation.</p>':''}<p>Ensemble, tout simplement.</p></article>`}
function paper(){return `<h1>À votre table. À votre image.</h1><p>Les couleurs et la composition suivent le modèle choisi dans votre site.</p><div class="grid"><section class="card"><h2>Composer le menu</h2><label>Plats et intitulés</label><textarea rows="15" oninput="data.menu=this.value;save();$('menuPreview').innerHTML=sheet('menu')">${esc(data.menu)}</textarea><div class="row" style="margin-top:20px"><button onclick="printSheet('menu')">Imprimer / PDF du menu</button><button onclick="printSheet('invite')">Imprimer l’invitation</button></div><p class="muted">Modifiez le message d’invitation dans Invités & présences. Pour les couleurs à l’impression, activez les arrière-plans dans les options du navigateur.</p></section><section id="menuPreview">${sheet('menu')}</section></div>`}
function printSheet(k){const host=document.createElement('div');host.className='print-only';host.innerHTML=sheet(k);if(k==='invite'&&data.remote){const c=document.createElement('canvas');host.querySelector('.sheet').append(c);QRCode.toCanvas(c,guestLink(),{width:180,margin:2}).then(()=>{document.body.append(host);window.print();host.remove()})}else{document.body.append(host);window.print();host.remove()}}
function gazette(){return `<h1>Votre journal, vos histoires.</h1><section class="card"><h2>La Gazette des Mariés</h2><p>Votre modèle de départ est intégré avec son éditeur complet : textes, photos, formes, pages, mots croisés et mots cachés.</p><p>Déplacez et redimensionnez chaque élément. Ajoutez des cases, changez les indices et exportez votre projet pour le reprendre plus tard.</p><a class="btn primary" href="/conubia/gazette/" target="_blank" rel="noopener">Ouvrir l’atelier gazette</a><p class="muted">L’atelier s’ouvre en grand. Le contenu du modèle fourni reste entièrement modifiable ; remplacez les exemples avant de l’imprimer.</p></section>`}
function music(){return `<h1>Votre Hit & Kiss.</h1><p>${data.songs.length} morceaux, à partir de la sélection de Laura et Giovanni. Modifiez les réponses et leurs variantes avant la partie.</p><section class="card"><h2>La playlist Spotify</h2><p>Associez un lien Spotify à chaque morceau pour garantir la bonne version. Connectez votre compte puis créez une playlist privée avec les morceaux renseignés.</p><p class="muted">La préparation automatique propose une version par titre. Vérifiez les liens : remixes et versions live peuvent différer.</p><label>Lien de votre playlist Spotify</label><input value="${esc(data.playlistURL||'')}" onchange="data.playlistURL=this.value;save()" placeholder="https://open.spotify.com/playlist/…"><div class="row" style="margin-top:15px"><button onclick="connectSpotify()">Connecter Spotify</button><button onclick="resolveTracks(this)">Préparer les morceaux Spotify</button><button onclick="createPlaylist(this)">Créer ma playlist privée</button>${/^https:\/\/open.spotify.com\/playlist\/[A-Za-z0-9]+$/.test(data.playlistURL||'')?`<a class="btn" href="${esc(data.playlistURL)}" target="_blank" rel="noopener">Ouvrir ma playlist</a>`:''}</div><details><summary>Configuration Spotify de l’early access</summary><p class="muted">La connexion nécessite une application Spotify autorisée. Aucun secret client n’est demandé. URL de retour à déclarer : ${esc(location.origin)}/conubia/atelier/</p><label>Client ID Spotify<input value="${esc(data.spotifyClient||'')}" onchange="data.spotifyClient=this.value.trim();save()"></label></details><p class="notice">La création Spotify dépend de l’autorisation de l’application. Le jeu multijoueur Conubia n’est pas encore connecté à cette sélection ; vous pouvez déjà préparer et tester toutes les réponses.</p></section><section class="card"><div class="row"><button onclick="data.songs.push({title:'Nouveau titre',artists:['Artiste'],years:[],titleAliases:[],artistAliases:[]});save();render()">Ajouter un morceau</button><button onclick="jsonDownload(data.songs,'conubia-hit-kiss.json')">Exporter la sélection</button></div>${data.songs.map((s,i)=>`<details class="song"><summary><b>${i+1}. ${esc(s.title)}</b><span>${esc(s.artists.join(' / '))}</span></summary><p class="muted">${esc(s.spotifyCandidate||'')}</p><div class="grid">${[['title','Titre officiel',s.title],['artists','Artistes (séparés par ;)',s.artists.join('; ')],['years','Années acceptées',s.years.join('; ')],['titleAliases','Autres écritures du titre',s.titleAliases.join('; ')],['artistAliases','Autres écritures des artistes',s.artistAliases.join('; ')],['spotify','Lien du morceau Spotify',s.spotify||'']].map(([k,l,v])=>`<label>${l}<input value="${esc(v)}" onchange="songEdit(${i},'${k}',this.value)"></label>`).join('')}</div><div class="row" style="margin-top:15px"><a class="btn" href="https://open.spotify.com/search/${encodeURIComponent(s.title+' '+s.artists.join(' '))}" target="_blank" rel="noopener">Chercher sur Spotify</a><button onclick="testSong(${i})">Tester les réponses</button><button onclick="if(confirm('Retirer ce morceau ?')){data.songs.splice(${i},1);save();render()}">Retirer</button></div></details>`).join('')}</section>`}
function songEdit(i,k,v){data.songs[i][k]=['title','spotify'].includes(k)?v:v.split(';').map(s=>s.trim()).filter(Boolean);save()}
function normalize(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function testSong(i){const s=data.songs[i];$('testDialog').innerHTML=`<h2>Tester ${esc(s.title)}</h2><label>Titre proposé<input id="testTitle"></label><label>Artiste proposé<input id="testArtist"></label><button onclick="checkAnswer(${i})">Vérifier</button><p id="testResult" aria-live="polite"></p><button onclick="$('testDialog').close()">Fermer</button>`;$('testDialog').showModal()}
function checkAnswer(i){const s=data.songs[i],match=(v,a)=>!!normalize(v)&&a.some(x=>normalize(x)===normalize(v));$('testResult').textContent='Titre : '+(match($('testTitle').value,[s.title,...s.titleAliases])?'accepté':'non reconnu')+' · Artiste : '+(match($('testArtist').value,[...s.artists,...s.artistAliases])?'accepté':'non reconnu')}
function pack(){return `<h1>Des souvenirs vivants.</h1><p>Le futur pack réunira ces expériences. Vous pouvez préparer vos choix ; aucun achat ni activation du partage pour le moment.</p><div class="grid">${[['audio','◉','Livre d’or audio','Un message vocal enregistré par chaque invité.'],['vintage','◎','Appareil photo vintage','Une pellicule de 24 poses, des regards spontanés.'],['challenges','✧','Défis photo','Des missions personnalisables pour faire participer les tables.'],['album','▧','Album photos & vidéos','Tous les souvenirs de la fête réunis.']].map(([k,ic,n,d])=>`<section class="card"><span class="tag">Futur pack · non activé</span><div class="pack-icon">${ic}</div><h2>${n}</h2><p>${d}</p><label class="check"><input type="checkbox" ${data.pack[k]?'checked':''} onchange="data.pack['${k}']=this.checked;save()">Prévoir cette expérience</label>${k==='audio'?'<button onclick="startAudio()">Tester un message vocal</button><button onclick="stopAudio()">Arrêter</button><div id="audioResult"></div><p class="muted">Test local de 60 secondes maximum. Téléchargez le message pour le conserver ; il n’est pas envoyé aux mariés.</p>':k==='vintage'?'<button onclick="parent.postMessage({type:\'conubia-module\',module:\'photos\'},location.origin)">Voir la démonstration vintage</button>':k==='challenges'?'<button onclick="parent.postMessage({type:\'conubia-module\',module:\'challenges\'},location.origin)">Personnaliser les défis</button>':''}</section>`).join('')}</div>`}
async function startAudio(){stopAudio();try{if(!window.MediaRecorder)throw Error('Enregistrement audio indisponible sur ce navigateur.');stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);const blob=new Blob(chunks,{type:recorder.mimeType});audioURL=URL.createObjectURL(blob);if($('audioResult'))$('audioResult').innerHTML=`<audio controls src="${audioURL}"></audio><br><a class="btn" href="${audioURL}" download="message-maries.${blob.type.includes('mp4')?'m4a':'webm'}">Télécharger le message</a>`};recorder.start();$('audioResult').textContent='Enregistrement en cours…';recordTimer=setTimeout(stopAudio,60000)}catch(e){status(e.message,true)}}
function stopAudio(){clearTimeout(recordTimer);if(recorder?.state==='recording')recorder.stop();stream?.getTracks().forEach(t=>t.stop())}window.addEventListener('pagehide',stopAudio);
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function connectSpotify(){if(window.top!==window.self){window.open('/conubia/atelier/?tab=music&connect=1','_blank','noopener');return}if(!/^[a-f0-9]{32}$/i.test(data.spotifyClient||'')){status('La connexion nécessite le Client ID d’une application Spotify autorisée. Ouvrez Configuration Spotify.',true);return}const verifier=b64(crypto.getRandomValues(new Uint8Array(48))),nonce=crypto.randomUUID(),redirect=location.origin+'/conubia/atelier/';sessionStorage.setItem('conubia-spotify-auth',JSON.stringify({verifier,nonce,redirect}));const challenge=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:data.spotifyClient,response_type:'code',redirect_uri:redirect,scope:'playlist-modify-private',state:nonce,code_challenge_method:'S256',code_challenge:challenge})}
async function spotifyReturn(){const q=new URLSearchParams(location.search);if(q.has('error')){status('Autorisation Spotify refusée.',true);return}if(!q.has('code'))return;try{const a=JSON.parse(sessionStorage.getItem('conubia-spotify-auth'));if(!a||a.nonce!==q.get('state'))throw Error('Retour Spotify invalide');window.history.replaceState({},'',location.pathname+'?tab=music');view='music';const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:data.spotifyClient,grant_type:'authorization_code',code:q.get('code'),redirect_uri:a.redirect,code_verifier:a.verifier})});const j=await r.json();if(!r.ok)throw Error(j.error_description||'Connexion refusée');sessionStorage.setItem('conubia-spotify-token',JSON.stringify({token:j.access_token,expires:Date.now()+j.expires_in*1000}));sessionStorage.removeItem('conubia-spotify-auth');render();status('Spotify connecté pour cette session.')}catch(e){status(e.message,true)}}
async function createPlaylist(btn){let t;try{t=JSON.parse(sessionStorage.getItem('conubia-spotify-token'))}catch{}if(!t||t.expires<Date.now())return status('Connectez Spotify avant de créer la playlist.',true);if(!data.songs.length)return status('Ajoutez au moins un morceau.',true);const ids=data.songs.map(s=>(s.spotify||'').match(/(?:spotify:track:|open\.spotify\.com\/track\/)([A-Za-z0-9]{22})/)?.[1]);if(ids.some(x=>!x))return status('Ajoutez le lien Spotify de chaque morceau. La bonne version doit être choisie avant la création.',true);btn.disabled=true;try{const call=async(path,body)=>{const r=await fetch('https://api.spotify.com/v1'+path,{method:'POST',headers:{Authorization:'Bearer '+t.token,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error?.message||'Spotify indisponible');return j};let id=data.pendingPlaylist;if(!id){const p=await call('/me/playlists',{name:'Hit & Kiss — '+context.names,public:false,description:'Sélection préparée dans Conubia'});id=p.id;data.pendingPlaylist=id;save()}for(let start=0;start<ids.length;start+=100)await call('/playlists/'+id+'/items',{uris:ids.slice(start,start+100).map(id=>'spotify:track:'+id)});data.playlistURL='https://open.spotify.com/playlist/'+id;delete data.pendingPlaylist;save();render();status('Playlist privée créée dans Spotify.')}catch(e){status(e.message,true);btn.disabled=false}}
render();spotifyReturn();if(new URLSearchParams(location.search).get('connect')==='1')connectSpotify();

async function resolveTracks(btn){let t;try{t=JSON.parse(sessionStorage.getItem('conubia-spotify-token'))}catch{}if(!t||t.expires<Date.now())return status('Connectez Spotify dans cet onglet avant de préparer les morceaux.',true);btn.disabled=true;let found=0;try{for(const s of data.songs){if(s.spotify)continue;status('Recherche Spotify : '+s.title);const r=await fetch('https://api.spotify.com/v1/search?'+new URLSearchParams({q:'track:'+s.title+' artist:'+s.artists[0],type:'track',limit:'1'}),{headers:{Authorization:'Bearer '+t.token}});const j=await r.json();if(!r.ok)throw Error(j.error?.message||'Recherche indisponible');const track=j.tracks?.items?.[0];if(track){s.spotify='https://open.spotify.com/track/'+track.id;s.spotifyCandidate=track.name+' — '+track.artists.map(x=>x.name).join(', ');found++;save()}}render();status(found+' liens proposés. Vérifiez les versions dans chaque morceau avant de créer la playlist.')}catch(e){status(e.message+' Les liens déjà trouvés sont conservés.',true);btn.disabled=false}}
</script></body></html>
