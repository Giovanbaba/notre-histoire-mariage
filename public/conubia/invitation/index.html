<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Conubia · Invitation</title><style>:root{--bg:#faf8f1;--text:#233e35;--accent:#233e35}*{box-sizing:border-box}body{margin:0;background:#f3f3ed;color:#233e35;font:15px/1.6 system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a.btn{cursor:pointer;border:1px solid #cbd3c5;border-radius:9px;padding:10px 16px;background:white;color:#233e35;text-decoration:none;display:inline-block}button:hover{background:#edf0e6}.primary{background:#233e35;color:white}button:disabled{opacity:.5;cursor:wait}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd3c5;border-radius:7px;background:#fff;color:#233e35}label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}header{padding:25px 5%;background:white;border-bottom:1px solid #dde1d8;display:flex;justify-content:space-between;align-items:center;gap:20px}header b{font:30px Georgia}nav{display:flex;gap:8px;flex-wrap:wrap;padding:20px 5%;background:#fff}nav .active{background:#233e35;color:white}main{max-width:1150px;margin:auto;padding:35px 25px}h1,h2,h3{line-height:1.15}h1{font:46px Georgia;margin:0 0 15px}h2{font:28px Georgia}h3{font:22px Georgia}.muted{color:#647462;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{padding:25px;background:white;border:1px solid #dce2d5;border-radius:14px;margin-bottom:20px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}.stats .card{margin:0}.stats b{display:block;font:38px Georgia}.tag{display:inline-block;font-size:11px;padding:5px 10px;background:#edf0df;border-radius:20px}.person{display:grid;grid-template-columns:1.2fr .7fr 1.4fr auto;gap:10px;margin:10px 0;align-items:end}.person label{margin-top:0}.notice{background:#f0ecd7;padding:15px 20px;border-radius:8px;font-size:13px}.error{color:#a02626}#status{padding:0 5%;font-size:14px;min-height:24px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:13px 10px;border-bottom:1px solid #dde1d5;vertical-align:top}.scroll{overflow:auto}.song{border-top:1px solid #dde1d5;padding:18px 0}.song summary{cursor:pointer;display:flex;justify-content:space-between;gap:15px}.sheet{background:var(--bg);color:var(--text);padding:55px 45px;min-height:650px;text-align:center;font-family:Georgia;border:1px solid currentColor}.sheet h1{font-size:42px}.sheet p{white-space:pre-line}.sheet .courses{font-size:20px;line-height:2.3;margin:40px 0}.sheet[data-theme=poster]{font-family:Impact,system-ui;text-transform:uppercase;border:8px solid}.sheet[data-theme=disco]{border-radius:70px 0}.sheet[data-theme=travel]{font-family:monospace;border:3px dashed}.sheet[data-theme=romance]{border:4px double;border-radius:160px 160px 0 0}.sheet[data-theme=floral],.sheet[data-theme=bohemian]{border-radius:180px 180px 0 0}.sheet[data-theme=minimal]{text-align:left;border:0}.sheet .ornament{font:60px Georgia;line-height:1;color:var(--accent)}.check{display:flex;align-items:start;gap:10px}.check input{width:auto;margin-top:5px}canvas{max-width:100%;height:auto}a{color:#345e4c}audio{max-width:100%}.guest-wrap{max-width:760px;margin:30px auto;padding:0 20px}body.guest{background:var(--bg);color:var(--text)}.guest h1{text-align:center}.guest .card{color:#233e35}.guest header{background:transparent;color:var(--text)}.success{padding:25px;background:#e6f0df;border-radius:15px}.pack-icon{font-size:32px}.print-only{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.person{grid-template-columns:1fr 1fr}.person>div:nth-child(3){grid-column:1/-1}h1{font-size:35px}main{padding:25px 15px}.card{padding:20px}header{align-items:start;flex-wrap:wrap}.sheet{padding:45px 20px}nav{gap:5px}nav button{font-size:12px;padding:8px}}@media print{body>*{display:none!important}body>.print-only{display:block!important}.sheet{width:148mm;min-height:210mm;page-break-after:always;margin:auto}body{background:white}@page{margin:10mm}}
</style></head><body class="guest"><header><b>conubia.</b><span>Une place pour vous.</span></header><main class="guest-wrap" id="body">Chargement de l’invitation…</main><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('event'),key=new URLSearchParams(location.hash.slice(1)).get('k');let eventInfo;const storage='conubia-response-'+id;let draft;try{draft=JSON.parse(localStorage.getItem(storage))}catch{}draft=draft||{id:crypto.randomUUID(),editToken:Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join(''),family:'',attending:'yes',people:[{name:'',kind:'adult',allergies:''}],note:''};
async function call(method='GET',body){const r=await fetch('/api/conubia/events/'+id+(method==='POST'?'/responses':''),{method,headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Service indisponible');return j}
function saveDraft(){try{localStorage.setItem(storage,JSON.stringify(draft))}catch{}}
function render(){document.title='Invitation — '+eventInfo.names;for(const k of ['bg','text','accent'])document.documentElement.style.setProperty('--'+k,eventInfo[k]);$('body').innerHTML=`<h1>${esc(eventInfo.names)}</h1><p style="text-align:center">${esc(eventInfo.date)} · ${esc(eventInfo.place)}</p><p style="text-align:center;white-space:pre-line">${esc(eventInfo.message)}</p><form class="card" onsubmit="submitResponse(event)"><h2>Votre réponse, en famille.</h2><label for="family">Nom de votre famille / foyer</label><input id="family" required maxlength="100" value="${esc(draft.family)}" oninput="draft.family=this.value;saveDraft()"><label for="attending">Serez-vous présents ?</label><select id="attending" onchange="draft.attending=this.value;saveDraft();render()"><option value="yes" ${draft.attending==='yes'?'selected':''}>Oui, avec plaisir</option><option value="no" ${draft.attending==='no'?'selected':''}>Nous ne pourrons pas venir</option></select>${draft.attending==='yes'?`<h3>Qui sera de la fête ?</h3><p class="muted">Ajoutez chaque adulte et chaque enfant. Indiquez les allergies ou restrictions alimentaires pour la personne concernée.</p>${draft.people.map((p,i)=>`<div class="person"><div><label>Prénom et nom<input required maxlength="80" value="${esc(p.name)}" oninput="draft.people[${i}].name=this.value;saveDraft()"></label></div><div><label>Catégorie<select onchange="draft.people[${i}].kind=this.value;saveDraft()"><option value="adult" ${p.kind==='adult'?'selected':''}>Adulte</option><option value="child" ${p.kind==='child'?'selected':''}>Enfant</option></select></label></div><div><label>Allergies / restrictions<input maxlength="300" placeholder="Ex. arachides, sans gluten…" value="${esc(p.allergies)}" oninput="draft.people[${i}].allergies=this.value;saveDraft()"></label></div><button type="button" aria-label="Retirer la personne ${i+1}" onclick="draft.people.splice(${i},1);saveDraft();render()">Retirer</button></div>`).join('')}<button type="button" onclick="if(draft.people.length<30){draft.people.push({name:'',kind:'adult',allergies:''});saveDraft();render()}">Ajouter une personne</button>`:''}<label>Un message pour les mariés</label><textarea maxlength="500" oninput="draft.note=this.value;saveDraft()">${esc(draft.note)}</textarea><label class="check"><input id="consent" type="checkbox" required>J’accepte de transmettre cette réponse et les éventuelles allergies aux mariés pour l’organisation de leur événement.</label><p class="muted">Ces informations sont consultables uniquement par les personnes disposant de l’accès privé des mariés. Renseignez seulement les informations utiles à l’accueil et au repas.</p><button id="send" class="primary" type="submit">Envoyer ma réponse</button><p id="result" role="status" aria-live="polite"></p></form><p class="muted">Sur ce même navigateur, vous pourrez revenir sur ce lien pour modifier votre réponse sans créer un doublon.</p>`}
async function submitResponse(ev){ev.preventDefault();$('send').disabled=true;try{await call('POST',{...draft,consent:$('consent').checked});saveDraft();$('result').className='success';$('result').textContent='Merci ! Votre réponse a bien été transmise aux mariés. Vous pouvez la modifier ici si nécessaire.'}catch(e){$('result').className='error';$('result').textContent=e.message}finally{$('send').disabled=false}}
(async()=>{try{if(!id||!key)throw Error('Ce lien d’invitation est incomplet. Demandez le lien ou le QR code aux mariés.');eventInfo=await call();render()}catch(e){$('body').textContent=e.message}})();
</script></body></html>
