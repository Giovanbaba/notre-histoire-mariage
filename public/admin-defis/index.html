<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b08"><title>Régie mariage | Lau & Gio</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#332817,#100d09 42%,#060504);color:#fff;font-family:Inter,system-ui,sans-serif;padding:22px}.wrap{max-width:1280px;margin:auto}.brand{color:#edcc82;letter-spacing:.24em;text-transform:uppercase;font-size:11px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:12px 0 22px}.head h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(42px,7vw,74px);line-height:.92;margin:0}.pill{padding:10px 14px;border-radius:999px;border:1px solid #ffffff20;background:#15120e}.login,.panel{background:#15120edc;border:1px solid #443927;border-radius:22px;padding:18px}.login{display:flex;gap:10px;margin-bottom:20px}.login input,.tools input,.tools select{background:#0b0907;color:#fff;border:1px solid #51452f;border-radius:14px;padding:13px;font-size:15px}.login input{flex:1;min-width:0}.btn{border:1px solid #ffffff1c;border-radius:13px;background:#231d14;color:#fff;padding:11px 14px;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.12)}.btn.primary{background:#edca7b;color:#1a140a}.btn.danger{background:#491919;color:#ffd0d0}.btn.warn{background:#3a2a12;color:#ffd893}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid #4b402e;background:#15120e;color:#bbb;border-radius:999px;padding:11px 17px;font-weight:800;cursor:pointer}.tab.active{background:#edca7b;color:#171108;border-color:#edca7b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{padding:18px;border-radius:18px;background:#15120e;border:1px solid #403623}.stat strong{display:block;font-size:34px;color:#edcb7e}.stat span{color:#aaa;font-size:13px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tools input{flex:1;min-width:220px}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.photo-card{position:relative;border-radius:18px;overflow:hidden;background:#17130f;border:1px solid #443927}.photo-card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#222;cursor:pointer}.photo-meta{padding:12px}.photo-meta b{display:block;font-family:Georgia,serif;font-size:18px}.photo-meta span{display:block;color:#aaa;font-size:12px;margin-top:3px}.photo-actions{display:flex;gap:8px;padding:0 12px 12px}.photo-actions .btn{flex:1}.table-card{margin-bottom:14px;border:1px solid #443a29;border-radius:20px;background:linear-gradient(145deg,#1e1912,#100d09);overflow:hidden}.table-top{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:17px}.table-name{font-family:Georgia,serif;font-size:28px}.score{font-size:24px;color:#edcc82;font-weight:900}.blocked{color:#ff9e9e;font-size:12px;font-weight:900;text-transform:uppercase}.actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 17px 17px}.challenge-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 17px 17px}.challenge{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-radius:12px;background:#0d0b08;border:1px solid #332c20;font-size:13px}.challenge.done{border-color:#496c4e;background:#112015}.challenge button{border:0;border-radius:9px;padding:7px 9px;cursor:pointer}.empty{text-align:center;color:#999;padding:42px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,30px);opacity:0;background:#edca7b;color:#171108;padding:12px 18px;border-radius:999px;font-weight:900;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:#000d;padding:25px}.modal.open{display:grid}.modal img{max-width:92vw;max-height:82vh;object-fit:contain;box-shadow:0 25px 90px #000}.modal .close{position:absolute;right:22px;top:22px;width:48px;height:48px;border-radius:50%;border:1px solid #ffffff30;background:#171717;color:#fff;font-size:24px}.modal .caption{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:#111d;border:1px solid #ffffff20;border-radius:16px;padding:10px 16px;text-align:center}@media(max-width:950px){.photos{grid-template-columns:repeat(3,1fr)}}@media(max-width:820px){body{padding:14px}.head{align-items:start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.table-top{grid-template-columns:1fr auto}.challenge-list{grid-template-columns:1fr}.login{flex-direction:column}.photos{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.photos{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand">L’appareil photo de Lau & Gio</div><section class="head"><h1>Régie<br>du mariage</h1><div class="pill" id="status">🔒 Verrouillé</div></section><section class="login"><input id="pin" type="password" inputmode="numeric" placeholder="Code administrateur Railway"><button class="btn primary" id="connect">Se connecter</button></section><nav class="tabs" id="tabs" hidden><button class="tab active" data-tab="photos">📸 Photos Live</button><button class="tab" data-tab="defis">🏆 Défis</button></nav><section id="photosView" hidden><section class="stats" id="photoStats"></section><div class="tools"><input id="search" placeholder="Rechercher un invité ou une table"><select id="tableFilter"><option value="">Toutes les tables</option></select><button class="btn" id="refresh">↻ Actualiser</button></div><section class="photos" id="photos"><div class="panel empty">Connectez-vous pour gérer les photos.</div></section></section><section id="defisView" hidden><section class="stats" id="stats"></section><section id="tables" class="panel"><div class="empty">Connectez-vous pour gérer les scores.</div></section></section></main><div class="toast" id="toast"></div><div class="modal" id="modal"><button class="close" id="close">×</button><img id="modalImg" alt="Photo agrandie"><div class="caption" id="modalCaption"></div></div><script>const $=id=>document.getElementById(id);let pin=sessionStorage.getItem('lg_admin_pin')||'',challengeData=null,dashboardData=null,currentTab='photos',loading=false;$('pin').value=pin;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function pretty(s){return String(s||'').replace(/-/g,' ')}async function api(url,options={}){const headers={'X-Admin-Pin':pin,...options.headers};if(options.body&&!headers['Content-Type'])headers['Content-Type']='application/json';const r=await fetch(url,{...options,headers,cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Erreur');return d}async function authenticate(){challengeData=await api('/api/admin/challenges');sessionStorage.setItem('lg_admin_pin',pin);$('status').textContent='🟢 Connecté';$('tabs').hidden=false;$('photosView').hidden=false;$('defisView').hidden=true;await loadPhotos();renderChallenges()}async function loadPhotos(){if(loading)return;loading=true;try{dashboardData=await api('/api/dashboard');renderPhotos();$('status').textContent='🟢 Connecté · Live'}catch(e){$('photos').innerHTML='<div class="panel empty">'+esc(e.message)+'</div>'}finally{loading=false}}function renderPhotos(){const all=dashboardData?.recent||[],q=$('search').value.trim().toLowerCase(),tf=$('tableFilter').value;const tables=[...new Set(all.map(p=>p.table))].sort();const old=$('tableFilter').value;$('tableFilter').innerHTML='<option value="">Toutes les tables</option>'+tables.map(t=>`<option value="${esc(t)}">${esc(pretty(t))}</option>`).join('');$('tableFilter').value=tables.includes(old)?old:'';const list=all.filter(p=>(!tf||p.table===tf)&&(!q||`${p.guest} ${p.table}`.toLowerCase().includes(q)));$('photoStats').innerHTML=`<div class="stat"><strong>${dashboardData.total||0}</strong><span>photos au total</span></div><div class="stat"><strong>${all.length}</strong><span>photos récentes chargées</span></div><div class="stat"><strong>${dashboardData.guestCount||0}</strong><span>participants</span></div><div class="stat"><strong>${dashboardData.tableCount||0}</strong><span>tables actives</span></div>`;$('photos').innerHTML=list.length?list.map(p=>`<article class="photo-card" data-key="${esc(p.key)}"><img src="${p.url}" alt="Souvenir" data-open="1"><div class="photo-meta"><b>${esc(pretty(p.guest))}</b><span>${esc(pretty(p.table))} · pellicule ${p.roll}, photo ${p.shot}</span></div><div class="photo-actions"><button class="btn" data-open="1">Agrandir</button><button class="btn danger" data-delete="1">🗑 Supprimer</button></div></article>`).join(''):'<div class="panel empty">Aucune photo trouvée.</div>';document.querySelectorAll('.photo-card').forEach(card=>{const p=all.find(x=>x.key===card.dataset.key);card.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPhoto(p));const del=card.querySelector('[data-delete]');del.onclick=()=>deletePhoto(p,del)})}function openPhoto(p){$('modalImg').src=p.url;$('modalCaption').textContent=`${pretty(p.guest)} · ${pretty(p.table)}`;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open');$('modalImg').src=''}async function deletePhoto(p,button){if(!confirm(`Supprimer définitivement la photo de ${pretty(p.guest)} (${pretty(p.table)}) ?\n\nElle disparaîtra aussi du mur et du mode DJ.`))return;button.disabled=true;try{const r=await fetch('/api/photo',{method:'DELETE',headers:{'Content-Type':'application/json','X-Admin-Pin':pin},body:JSON.stringify({key:p.key})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Suppression impossible');toast('🗑️ Photo supprimée');dashboardData.recent=dashboardData.recent.filter(x=>x.key!==p.key);dashboardData.total=Math.max(0,(dashboardData.total||1)-1);renderPhotos();closeModal()}catch(e){toast(e.message)}finally{button.disabled=false}}function renderChallenges(){const tables=challengeData.tables||[],blocked=tables.filter(t=>t.blocked).length,total=tables.reduce((s,t)=>s+t.score,0),done=tables.reduce((s,t)=>s+t.completed.length,0);$('stats').innerHTML=`<div class="stat"><strong>${tables.length}</strong><span>tables participantes</span></div><div class="stat"><strong>${total}</strong><span>points distribués</span></div><div class="stat"><strong>${done}</strong><span>défis validés</span></div><div class="stat"><strong>${blocked}</strong><span>tables bloquées</span></div>`;$('tables').className='';$('tables').innerHTML=tables.length?tables.map(t=>`<article class="table-card"><div class="table-top"><div><div class="table-name">${esc(t.name)}</div>${t.blocked?'<div class="blocked">Table bloquée</div>':''}</div><div class="score">${t.score} pts</div><div>#${(challengeData.leaderboard.find(x=>x.name===t.name)||{}).rank||'-'}</div></div><div class="actions"><button class="btn primary" data-act="adjust" data-table="${esc(t.name)}" data-points="100">+100</button><button class="btn" data-act="adjust" data-table="${esc(t.name)}" data-points="-100">−100</button><button class="btn warn" data-act="toggle-block" data-table="${esc(t.name)}">${t.blocked?'Débloquer':'Bloquer'}</button><button class="btn danger" data-act="reset" data-table="${esc(t.name)}">Réinitialiser</button><button class="btn danger" data-act="delete-table" data-table="${esc(t.name)}">Supprimer</button></div><div class="challenge-list">${challengeData.challenges.map(c=>{const done=t.completed.includes(c.id);return `<div class="challenge ${done?'done':''}"><span>${c.emoji} ${esc(c.title)} · ${c.points} pts</span><button data-act="${done?'remove-challenge':'add-challenge'}" data-table="${esc(t.name)}" data-challenge="${c.id}">${done?'Retirer':'Ajouter'}</button></div>`}).join('')}</div></article>`).join(''):'<div class="panel empty">Aucune table participante.</div>';document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>challengeAction(b))}async function challengeAction(b){const action=b.dataset.act,table=b.dataset.table;if((action==='reset'||action==='delete-table')&&!confirm(`Confirmer l’action pour ${table} ?`))return;b.disabled=true;try{await api('/api/admin/challenges/action',{method:'POST',body:JSON.stringify({action,table,points:Number(b.dataset.points||0),challengeId:b.dataset.challenge||''})});toast('✅ Modification enregistrée');challengeData=await api('/api/admin/challenges');renderChallenges()}catch(e){toast(e.message)}finally{b.disabled=false}}$('connect').onclick=async()=>{pin=$('pin').value.trim();if(!pin)return;try{await authenticate()}catch(e){$('status').textContent='🔴 Accès refusé';toast(e.message)}};$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('connect').click()});document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{currentTab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));$('photosView').hidden=currentTab!=='photos';$('defisView').hidden=currentTab!=='defis';if(currentTab==='photos')loadPhotos()});$('search').oninput=renderPhotos;$('tableFilter').onchange=renderPhotos;$('refresh').onclick=loadPhotos;$('close').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});if(pin)authenticate().catch(e=>{$('status').textContent='🔴 Accès refusé';toast(e.message)});setInterval(()=>{if(pin&&currentTab==='photos')loadPhotos()},3000);</script></body></html>
