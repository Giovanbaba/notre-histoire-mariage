<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b08"><title>Régie mariage | Lau & Gio</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#332817,#100d09 42%,#060504);color:#fff;font-family:Inter,system-ui,sans-serif;padding:20px}.wrap{max-width:1320px;margin:auto}.brand{color:#edcc82;letter-spacing:.24em;text-transform:uppercase;font-size:11px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:12px 0 20px}.head h1{font:400 clamp(42px,7vw,74px)/.92 Georgia,serif;margin:0}.pill{padding:10px 14px;border:1px solid #ffffff20;border-radius:999px;background:#15120e}.login,.panel{background:#15120edc;border:1px solid #443927;border-radius:22px;padding:18px}.login{display:flex;gap:10px;margin-bottom:18px}.login input,.tools input,.tools select{background:#0b0907;color:#fff;border:1px solid #51452f;border-radius:14px;padding:13px;font-size:15px}.login input{flex:1}.btn{border:1px solid #ffffff1c;border-radius:13px;background:#231d14;color:#fff;padding:11px 14px;font-weight:800;cursor:pointer}.btn.primary{background:#edca7b;color:#1a140a}.btn.danger{background:#491919;color:#ffd0d0}.btn.warn{background:#3a2a12;color:#ffd893}.tabs,.shortcuts,.tools,.actions,.photo-actions{display:flex;gap:9px;flex-wrap:wrap}.tabs{margin-bottom:16px}.tab{border:1px solid #4b402e;background:#15120e;color:#bbb;border-radius:999px;padding:11px 17px;font-weight:800}.tab.active{background:#edca7b;color:#171108}.shortcuts{margin-bottom:18px}.shortcuts a{text-decoration:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{padding:17px;border-radius:18px;background:#15120e;border:1px solid #403623}.stat strong{display:block;font-size:33px;color:#edcb7e}.stat span{color:#aaa;font-size:13px}.tools{margin-bottom:18px}.tools input{flex:1;min-width:220px}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.photo-card{border:1px solid #443927;border-radius:18px;overflow:hidden;background:#17130f}.photo-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}.photo-meta{padding:12px}.photo-meta b{display:block;font:20px Georgia,serif}.photo-meta span{color:#aaa;font-size:12px}.ai-result{margin-top:8px;padding:9px;border-radius:11px;background:#0d0b08;font-size:12px}.ai-result strong{color:#edca7b}.photo-actions{padding:0 12px 12px}.photo-actions .btn{flex:1}.table-card{margin-bottom:14px;border:1px solid #443a29;border-radius:20px;background:linear-gradient(145deg,#1e1912,#100d09);overflow:hidden}.table-top{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:17px}.table-name{font:28px Georgia,serif}.score{font-size:24px;color:#edcc82;font-weight:900}.challenge-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 17px 17px}.challenge{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px;border-radius:12px;background:#0d0b08;border:1px solid #332c20;font-size:13px}.challenge.done{background:#112015;border-color:#496c4e}.empty{text-align:center;color:#999;padding:42px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,30px);opacity:0;background:#edca7b;color:#171108;padding:12px 18px;border-radius:999px;font-weight:900;transition:.25s;z-index:60}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:#000e;padding:25px}.modal.open{display:grid}.modal-content{max-width:min(1100px,94vw);max-height:92vh;overflow:auto;background:#111;border:1px solid #ffffff22;border-radius:24px;padding:18px}.modal img{max-width:100%;max-height:65vh;display:block;margin:auto}.modal h2{font:34px Georgia,serif}.profiles{display:grid;gap:8px}.profile{padding:10px;border:1px solid #ffffff18;border-radius:12px}.close{position:fixed;right:22px;top:22px;width:48px;height:48px;border-radius:50%;background:#171717;color:#fff;border:1px solid #ffffff30;font-size:24px}@media(max-width:950px){.photos{grid-template-columns:repeat(3,1fr)}}@media(max-width:780px){body{padding:13px}.head{align-items:start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.photos{grid-template-columns:repeat(2,1fr)}.challenge-list{grid-template-columns:1fr}.login{flex-direction:column}}@media(max-width:500px){.photos{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand">L’appareil photo de Lau & Gio</div><section class="head"><h1>Régie<br>du mariage</h1><div class="pill" id="status">🔒 Verrouillé</div></section><section class="login"><input id="pin" type="password" inputmode="numeric" placeholder="Code administrateur Railway"><button class="btn primary" id="connect">Se connecter</button></section><nav class="shortcuts" id="shortcuts" hidden><a class="btn" href="/mur/" target="_blank">📺 Mur IA</a><a class="btn" href="/dj/" target="_blank">🎞️ Mode DJ</a><a class="btn" href="/roue/" target="_blank">🎡 Roue</a><a class="btn" href="/recompenses/" target="_blank">👑 Récompenses</a><a class="btn" href="/classement/" target="_blank">🏆 Classement</a></nav><nav class="tabs" id="tabs" hidden><button class="tab active" data-tab="photos">📸 Photos Live</button><button class="tab" data-tab="defis">🎯 Défis</button></nav><section id="photosView" hidden><section class="stats" id="photoStats"></section><div class="tools"><input id="search" placeholder="Rechercher un invité ou une table"><select id="tableFilter"><option value="">Toutes les tables</option></select><button class="btn" id="refresh">↻ Actualiser</button></div><section class="photos" id="photos"></section></section><section id="defisView" hidden><section class="stats" id="challengeStats"></section><section id="tables"></section></section></main><div class="toast" id="toast"></div><div class="modal" id="modal"><button class="close" id="close">×</button><div class="modal-content"><img id="modalImg" alt="Photo"><h2 id="modalTitle"></h2><p id="modalComment"></p><div class="profiles" id="modalProfiles"></div></div></div><script>
const $=id=>document.getElementById(id);let pin=sessionStorage.getItem('lg_admin_pin')||'',photosData={photos:[],total:0},challengeData=null,currentTab='photos',loading=false;$('pin').value=pin;function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function pretty(s){return String(s||'').replace(/-/g,' ')}function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2300)}async function api(url,options={}){const headers={'X-Admin-Pin':pin,...options.headers};if(options.body&&!headers['Content-Type'])headers['Content-Type']='application/json';const r=await fetch(url,{...options,headers,cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Erreur');return d}
async function authenticate(){challengeData=await api('/api/admin/challenges');sessionStorage.setItem('lg_admin_pin',pin);$('status').textContent='🟢 Connecté';$('tabs').hidden=false;$('shortcuts').hidden=false;$('photosView').hidden=false;await loadPhotos();renderChallenges()}
async function loadPhotos(){if(loading)return;loading=true;try{photosData=await api('/api/admin/photos');renderPhotos();$('status').textContent='🟢 Connecté · Live'}catch(e){$('photos').innerHTML=`<div class="panel empty">${esc(e.message)}</div>`}finally{loading=false}}
function renderPhotos(){const all=photosData.photos||[],q=$('search').value.trim().toLowerCase(),tf=$('tableFilter').value,tables=[...new Set(all.map(p=>p.table))].sort(),old=$('tableFilter').value;$('tableFilter').innerHTML='<option value="">Toutes les tables</option>'+tables.map(t=>`<option value="${esc(t)}">${esc(pretty(t))}</option>`).join('');$('tableFilter').value=tables.includes(old)?old:'';const list=all.filter(p=>(!tf||p.table===tf)&&(!q||`${p.guest} ${p.table}`.toLowerCase().includes(q)));$('photoStats').innerHTML=`<div class="stat"><strong>${photosData.total||0}</strong><span>photos au total</span></div><div class="stat"><strong>${list.length}</strong><span>photos affichées</span></div><div class="stat"><strong>${all.filter(p=>p.analysis).length}</strong><span>analysées par l’IA</span></div><div class="stat"><strong>${tables.length}</strong><span>tables actives</span></div>`;$('photos').innerHTML=list.length?list.map(p=>`<article class="photo-card" data-key="${esc(p.key)}"><img src="${p.url}" alt="Souvenir" data-open><div class="photo-meta"><b>${esc(pretty(p.guest))}</b><span>${esc(pretty(p.table))} · pellicule ${p.roll}, photo ${p.shot}</span>${p.analysis?`<div class="ai-result"><strong>${esc(p.analysis.emoji||'🎭')} ${esc(p.analysis.title)}</strong><br>${Number(p.analysis.score||0)} %</div>`:'<div class="ai-result">Pas encore analysée</div>'}</div><div class="photo-actions"><button class="btn" data-ai>${p.analysis?'Relancer IA':'Analyser IA'}</button><button class="btn danger" data-delete>🗑 Supprimer</button></div></article>`).join(''):'<div class="panel empty">Aucune photo trouvée.</div>';document.querySelectorAll('.photo-card').forEach(card=>{const p=all.find(x=>x.key===card.dataset.key);card.querySelector('[data-open]').onclick=()=>openPhoto(p);card.querySelector('[data-ai]').onclick=e=>analyzePhoto(p,e.currentTarget);card.querySelector('[data-delete]').onclick=e=>deletePhoto(p,e.currentTarget)})}
function openPhoto(p){$('modalImg').src=p.url;$('modalTitle').textContent=p.analysis?`${p.analysis.emoji||'🎭'} ${p.analysis.title}`:`${pretty(p.guest)} · ${pretty(p.table)}`;$('modalComment').textContent=p.analysis?.comment||'Cette photo n’a pas encore été analysée.';$('modalProfiles').innerHTML=(p.analysis?.profiles||[]).map((x,i)=>`<div class="profile"><b>${i+1}. ${esc(x.emoji||'🎭')} ${esc(x.title)} — ${x.score}%</b><br><small>${esc(x.reason)}</small></div>`).join('');$('modal').classList.add('open')}
async function analyzePhoto(p,b){b.disabled=true;b.textContent='Analyse…';try{const r=await fetch('/api/ai/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:p.key,guest:p.guest,table:p.table,force:Boolean(p.analysis)})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Analyse impossible');p.analysis=d.analysis;toast('🧠 Analyse réelle terminée');renderPhotos();openPhoto(p)}catch(e){toast(e.message)}finally{b.disabled=false}}
async function deletePhoto(p,b){if(!confirm(`Supprimer définitivement la photo de ${pretty(p.guest)} ?\nElle disparaîtra du mur et du DJ.`))return;b.disabled=true;try{const r=await fetch('/api/photo',{method:'DELETE',headers:{'Content-Type':'application/json','X-Admin-Pin':pin},body:JSON.stringify({key:p.key})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Suppression impossible');photosData.photos=photosData.photos.filter(x=>x.key!==p.key);photosData.total=Math.max(0,photosData.total-1);toast('🗑️ Photo supprimée');renderPhotos()}catch(e){toast(e.message)}finally{b.disabled=false}}
function renderChallenges(){const tables=challengeData.tables||[],blocked=tables.filter(t=>t.blocked).length,total=tables.reduce((s,t)=>s+t.score,0),done=tables.reduce((s,t)=>s+t.completed.length,0);$('challengeStats').innerHTML=`<div class="stat"><strong>${tables.length}</strong><span>tables</span></div><div class="stat"><strong>${total}</strong><span>points</span></div><div class="stat"><strong>${done}</strong><span>défis réussis</span></div><div class="stat"><strong>${blocked}</strong><span>tables bloquées</span></div>`;$('tables').innerHTML=tables.length?tables.map(t=>`<article class="table-card"><div class="table-top"><div class="table-name">${esc(pretty(t.name))}</div><div class="score">${t.score} pts</div><div>#${(challengeData.leaderboard.find(x=>x.name===t.name)||{}).rank||'-'}</div></div><div class="actions" style="padding:0 17px 17px"><button class="btn primary" data-act="adjust" data-table="${esc(t.name)}" data-points="100">+100</button><button class="btn" data-act="adjust" data-table="${esc(t.name)}" data-points="-100">−100</button><button class="btn warn" data-act="toggle-block" data-table="${esc(t.name)}">${t.blocked?'Débloquer':'Bloquer'}</button><button class="btn danger" data-act="reset" data-table="${esc(t.name)}">Réinitialiser</button></div><div class="challenge-list">${challengeData.challenges.map(c=>{const done=t.completed.includes(c.id);return`<div class="challenge ${done?'done':''}"><span>${c.emoji} ${esc(c.title)} · ${c.points}</span><button data-act="${done?'remove-challenge':'add-challenge'}" data-table="${esc(t.name)}" data-challenge="${c.id}">${done?'Retirer':'Ajouter'}</button></div>`}).join('')}</div></article>`).join(''):'<div class="panel empty">Aucune table.</div>';document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>challengeAction(b))}
async function challengeAction(b){const action=b.dataset.act,table=b.dataset.table;if(action==='reset'&&!confirm(`Réinitialiser ${table} ?`))return;b.disabled=true;try{await api('/api/admin/challenges/action',{method:'POST',body:JSON.stringify({action,table,points:Number(b.dataset.points||0),challengeId:b.dataset.challenge||''})});challengeData=await api('/api/admin/challenges');renderChallenges();toast('✅ Modification enregistrée')}catch(e){toast(e.message)}finally{b.disabled=false}}
$('connect').onclick=async()=>{pin=$('pin').value.trim();if(!pin)return;try{await authenticate()}catch(e){$('status').textContent='🔴 Accès refusé';toast(e.message)}};$('pin').onkeydown=e=>{if(e.key==='Enter')$('connect').click()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{currentTab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));$('photosView').hidden=currentTab!=='photos';$('defisView').hidden=currentTab!=='defis';if(currentTab==='photos')loadPhotos()});$('search').oninput=renderPhotos;$('tableFilter').onchange=renderPhotos;$('refresh').onclick=loadPhotos;$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};if(pin)authenticate().catch(e=>toast(e.message));setInterval(()=>{if(pin&&currentTab==='photos')loadPhotos()},3000);
</script></body></html>
