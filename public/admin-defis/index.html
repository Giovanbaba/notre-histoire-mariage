<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b08"><title>Admin défis | Lau & Gio</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#332817,#100d09 42%,#060504);color:#fff;font-family:Inter,system-ui,sans-serif;padding:22px}.wrap{max-width:1180px;margin:auto}.brand{color:#edcc82;letter-spacing:.24em;text-transform:uppercase;font-size:11px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:12px 0 22px}.head h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(42px,7vw,74px);line-height:.92;margin:0}.pill{padding:10px 14px;border-radius:999px;border:1px solid #ffffff20;background:#15120e}.login,.panel{background:#15120edc;border:1px solid #443927;border-radius:22px;padding:18px}.login{display:flex;gap:10px;margin-bottom:20px}.login input{flex:1;min-width:0;background:#0b0907;color:#fff;border:1px solid #51452f;border-radius:14px;padding:14px;font-size:16px}.btn{border:1px solid #ffffff1c;border-radius:13px;background:#231d14;color:#fff;padding:11px 14px;font-weight:800;cursor:pointer}.btn.primary{background:#edca7b;color:#1a140a}.btn.danger{background:#3a1717;color:#ffb6b6}.btn.warn{background:#3a2a12;color:#ffd893}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{padding:18px;border-radius:18px;background:#15120e;border:1px solid #403623}.stat strong{display:block;font-size:34px;color:#edcb7e}.stat span{color:#aaa;font-size:13px}.table-card{margin-bottom:14px;border:1px solid #443a29;border-radius:20px;background:linear-gradient(145deg,#1e1912,#100d09);overflow:hidden}.table-top{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:17px}.table-name{font-family:Georgia,serif;font-size:28px}.score{font-size:24px;color:#edcc82;font-weight:900}.blocked{color:#ff9e9e;font-size:12px;font-weight:900;text-transform:uppercase}.actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 17px 17px}.challenge-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 17px 17px}.challenge{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-radius:12px;background:#0d0b08;border:1px solid #332c20;font-size:13px}.challenge.done{border-color:#496c4e;background:#112015}.challenge button{border:0;border-radius:9px;padding:7px 9px;cursor:pointer}.empty{text-align:center;color:#999;padding:42px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,30px);opacity:0;background:#edca7b;color:#171108;padding:12px 18px;border-radius:999px;font-weight:900;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:820px){body{padding:14px}.head{align-items:start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.table-top{grid-template-columns:1fr auto}.challenge-list{grid-template-columns:1fr}.login{flex-direction:column}}</style></head><body><main class="wrap"><div class="brand">L’appareil photo de Lau & Gio</div><section class="head"><h1>Administration<br>des défis</h1><div class="pill" id="status">🔒 Verrouillé</div></section><section class="login"><input id="pin" type="password" inputmode="numeric" placeholder="Code administrateur Railway"><button class="btn primary" id="connect">Se connecter</button></section><section class="stats" id="stats" hidden></section><section id="tables" class="panel"><div class="empty">Connectez-vous pour gérer les scores.</div></section></main><div class="toast" id="toast"></div><script>const $=id=>document.getElementById(id);let pin=sessionStorage.getItem('lg_admin_pin')||'',data=null;$('pin').value=pin;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','X-Admin-Pin':pin,...options.headers}}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Erreur');return d}async function load(){if(!pin)return;try{data=await api('/api/admin/challenges');$('status').textContent='🟢 Connecté';$('stats').hidden=false;render()}catch(e){$('status').textContent='🔴 Accès refusé';$('tables').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}function render(){const tables=data.tables||[],blocked=tables.filter(t=>t.blocked).length,total=tables.reduce((s,t)=>s+t.score,0),done=tables.reduce((s,t)=>s+t.completed.length,0);$('stats').innerHTML=`<div class="stat"><strong>${tables.length}</strong><span>tables participantes</span></div><div class="stat"><strong>${total}</strong><span>points distribués</span></div><div class="stat"><strong>${done}</strong><span>défis validés</span></div><div class="stat"><strong>${blocked}</strong><span>tables bloquées</span></div>`;$('tables').className='';$('tables').innerHTML=tables.length?tables.map(t=>`<article class="table-card"><div class="table-top"><div><div class="table-name">${esc(t.name)}</div>${t.blocked?'<div class="blocked">Table bloquée</div>':''}</div><div class="score">${t.score} pts</div><div>#${(data.leaderboard.find(x=>x.name===t.name)||{}).rank||'-'}</div></div><div class="actions"><button class="btn primary" data-act="adjust" data-table="${esc(t.name)}" data-points="100">+100</button><button class="btn" data-act="adjust" data-table="${esc(t.name)}" data-points="-100">−100</button><button class="btn warn" data-act="toggle-block" data-table="${esc(t.name)}">${t.blocked?'Débloquer':'Bloquer'}</button><button class="btn danger" data-act="reset" data-table="${esc(t.name)}">Réinitialiser</button><button class="btn danger" data-act="delete-table" data-table="${esc(t.name)}">Supprimer</button></div><div class="challenge-list">${data.challenges.map(c=>{const done=t.completed.includes(c.id);return `<div class="challenge ${done?'done':''}"><span>${c.emoji} ${esc(c.title)} · ${c.points} pts</span><button data-act="${done?'remove-challenge':'add-challenge'}" data-table="${esc(t.name)}" data-challenge="${c.id}">${done?'Retirer':'Ajouter'}</button></div>`}).join('')}</div></article>`).join(''):'<div class="panel empty">Aucune table participante.</div>';document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b))}async function action(b){const action=b.dataset.act,table=b.dataset.table;if((action==='reset'||action==='delete-table')&&!confirm(`Confirmer l’action pour ${table} ?`))return;b.disabled=true;try{await api('/api/admin/challenges/action',{method:'POST',body:JSON.stringify({action,table,points:Number(b.dataset.points||0),challengeId:b.dataset.challenge||''})});toast('✅ Modification enregistrée');await load()}catch(e){toast(e.message)}finally{b.disabled=false}}$('connect').onclick=()=>{pin=$('pin').value.trim();sessionStorage.setItem('lg_admin_pin',pin);load()};if(pin)load();setInterval(()=>{if(pin)load()},5000);</script></body></html>
