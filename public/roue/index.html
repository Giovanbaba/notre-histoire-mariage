<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0806"><title>Roue des défis | Lau & Gio</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at center,#34210d,#0c0906 62%,#030201);color:#fff;font-family:Inter,system-ui,sans-serif}.stage{position:fixed;inset:0;display:grid;grid-template-columns:1fr .8fr;gap:30px;align-items:center;padding:35px}.brand{position:absolute;top:24px;left:30px;color:#efcc7c;letter-spacing:.24em;text-transform:uppercase;font-size:11px}.wheel-wrap{display:grid;place-items:center;position:relative}.pointer{position:absolute;top:2%;z-index:5;font-size:58px;filter:drop-shadow(0 8px 10px #000)}.wheel{width:min(72vh,680px);aspect-ratio:1;border-radius:50%;border:12px solid #efcc7c;box-shadow:0 0 0 7px #5b431c,0 28px 80px #000;position:relative;overflow:hidden;transition:transform 5.2s cubic-bezier(.13,.74,.12,1)}.wheel:after{content:"L & G";position:absolute;inset:36%;display:grid;place-items:center;border-radius:50%;background:#130e08;border:7px solid #efcc7c;color:#efcc7c;font-family:Georgia,serif;font-size:clamp(24px,4vw,48px);box-shadow:0 0 35px #000}.slice{position:absolute;left:50%;top:50%;width:50%;height:50%;transform-origin:0 0;overflow:hidden}.slice span{position:absolute;left:22%;top:12%;width:140px;text-align:center;font-weight:900;font-size:14px;transform:rotate(45deg);text-shadow:0 2px 8px #000}.panel{padding:30px;border:1px solid #584522;border-radius:28px;background:#15100acc;backdrop-filter:blur(12px)}.eyebrow{color:#efcc7c;letter-spacing:.2em;text-transform:uppercase;font-size:11px}.panel h1{font-family:Georgia,serif;font-size:clamp(45px,6vw,82px);line-height:.92;margin:10px 0 18px}.result{min-height:155px;padding:20px;border-radius:20px;background:#0c0906;border:1px solid #3e321e}.result .emoji{font-size:42px}.result h2{font-family:Georgia,serif;font-size:34px;margin:5px 0}.result p{color:#bbb;line-height:1.5}.result strong{color:#efcc7c}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button{border:1px solid #ffffff22;border-radius:15px;background:#21180d;color:#fff;padding:14px 18px;font-weight:900;cursor:pointer}.actions .primary{background:#efcc7c;color:#171007}.actions button:disabled{opacity:.45}.status{position:absolute;right:28px;top:24px;padding:9px 13px;border-radius:999px;border:1px solid #ffffff20;background:#1119}.history{margin-top:18px;color:#888;font-size:12px}.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .7s ease-out}@keyframes flash{0%{opacity:.9}100%{opacity:0}}@media(max-width:900px){html,body{overflow:auto}.stage{position:relative;min-height:100%;grid-template-columns:1fr;padding:85px 18px 25px}.wheel{width:min(88vw,600px)}.brand{left:18px}.status{right:18px}}</style></head><body><div class="brand">Laura & Giovanni · animation live</div><div class="status" id="status">Chargement…</div><main class="stage"><section class="wheel-wrap"><div class="pointer">🔻</div><div class="wheel" id="wheel"></div></section><section class="panel"><div class="eyebrow">V5.3</div><h1>La roue des défis</h1><div class="result" id="result"><div class="emoji">🎲</div><h2>Prêts à jouer ?</h2><p>La roue choisira un défi aléatoire pour toutes les tables.</p></div><div class="actions"><button class="primary" id="spin">🎡 Lancer la roue</button><button id="announce">🎤 Annoncer</button><button id="fullscreen">⛶ Plein écran</button></div><div class="history" id="history">Aucun défi tiré pour le moment.</div></section></main><div class="flash" id="flash"></div><script>const $=id=>document.getElementById(id);let challenges=[],rotation=0,current=null,spinning=false,history=[];function esc(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function build(){const w=$('wheel'),n=challenges.length;w.innerHTML='';challenges.forEach((c,i)=>{const el=document.createElement('div');el.className='slice';el.style.transform=`rotate(${i*360/n}deg) skewY(${90-360/n}deg)`;el.style.background=i%2?'#7d541d':'#b97d27';el.innerHTML=`<span style="transform:skewY(${-90+360/n}deg) rotate(${180/n}deg)">${c.emoji}<br>${esc(c.title)}</span>`;w.appendChild(el)})}async function load(){try{const r=await fetch('/api/challenges',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error();challenges=d.challenges||[];build();$('status').textContent=`${challenges.length} défis prêts`}catch{$('status').textContent='Défis indisponibles'}}function renderResult(c){$('result').innerHTML=`<div class="emoji">${c.emoji}</div><h2>${esc(c.title)}</h2><p>${esc(c.text)}</p><strong>+${c.points} points</strong>`;history.unshift(c.title);$('history').textContent='Derniers tirages : '+history.slice(0,4).join(' · ')}async function speak(text){try{const r=await fetch('/api/ai/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw Error();const audio=new Audio(URL.createObjectURL(await r.blob()));await audio.play()}catch{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';speechSynthesis.speak(u)}}function spin(){if(spinning||!challenges.length)return;spinning=true;$('spin').disabled=true;const index=Math.floor(Math.random()*challenges.length),segment=360/challenges.length,target=360-(index*segment+segment/2);rotation+=1440+target-(rotation%360);$('wheel').style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{current=challenges[index];renderResult(current);$('flash').classList.remove('go');void $('flash').offsetWidth;$('flash').classList.add('go');speak(`Attention tout le monde. Le défi tiré est : ${current.title}. ${current.text}. Il rapporte ${current.points} points.`);spinning=false;$('spin').disabled=false},5250)}$('spin').onclick=spin;$('announce').onclick=()=>{if(current)speak(`Le défi en cours est ${current.title}. ${current.text}. ${current.points} points à gagner.`)};$('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}};document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();spin()}if(e.key.toLowerCase()==='f')$('fullscreen').click()});load();</script></body></html>
