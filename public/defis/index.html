<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#120f0a">
  <title>Défis photos | Lau & Gio</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#3a2e1c,#15110b 40%,#080706);color:#fff;font-family:Inter,system-ui,sans-serif;padding:22px}.wrap{max-width:1080px;margin:auto}.brand{color:#edcf87;letter-spacing:.24em;text-transform:uppercase;font-size:11px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;align-items:end;margin:12px 0 24px}.hero h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(45px,8vw,82px);line-height:.9;margin:0}.score{background:#19150f;border:1px solid #4c402b;border-radius:22px;padding:20px;text-align:center}.score strong{display:block;color:#efcb79;font-size:48px}.score span{color:#aaa}.setup,.panel{background:#15130fdd;border:1px solid #403728;border-radius:22px;padding:18px}.setup{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-bottom:20px}.setup input{min-width:0;border:1px solid #51452f;border-radius:14px;background:#0d0b08;color:#fff;padding:14px;font-size:16px}.btn{border:0;border-radius:14px;padding:13px 16px;background:#edca7b;color:#1b150b;font-weight:900;cursor:pointer}.tabs{display:flex;gap:8px;margin:18px 0}.tab{border:1px solid #4b4131;background:#17140f;color:#ddd;border-radius:999px;padding:10px 15px;cursor:pointer}.tab.active{background:#edca7b;color:#1b150b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{position:relative;min-height:250px;padding:20px;border:1px solid #4b402e;border-radius:22px;background:linear-gradient(145deg,#211b12,#110f0b);display:flex;flex-direction:column}.emoji{font-size:40px}.card h2{font-family:Georgia,serif;font-weight:400;font-size:27px;margin:14px 0 8px}.card p{color:#bbb;line-height:1.45;margin:0 0 20px}.points{margin-top:auto;color:#edcc82;font-weight:900}.complete{margin-top:12px;width:100%;border:1px solid #68583d;background:#272116;color:#fff;border-radius:13px;padding:11px;font-weight:800;cursor:pointer}.card.done{opacity:.66}.card.done::after{content:'✓ Validé';position:absolute;top:15px;right:15px;background:#6bd287;color:#09220f;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900}.ranking{display:none}.ranking.show,.challenges.show{display:block}.challenges{display:none}.row{display:grid;grid-template-columns:55px 1fr auto;gap:12px;align-items:center;padding:14px 5px;border-bottom:1px solid #ffffff15}.rank{font-size:27px;font-weight:900;color:#edcc82}.bar{height:8px;background:#2a251d;border-radius:999px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#edca7b}.empty{text-align:center;color:#999;padding:40px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,30px);opacity:0;background:#edca7b;color:#171108;padding:12px 18px;border-radius:999px;font-weight:900;transition:.25s;z-index:60}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:18px;background:#000c;backdrop-filter:blur(10px)}.modal.open{display:grid}.sheet{width:min(520px,100%);background:#17130d;border:1px solid #55472f;border-radius:24px;padding:22px}.sheet h2{font-family:Georgia,serif;font-size:32px;font-weight:400;margin:0 0 8px}.sheet p{color:#bbb;line-height:1.45}.preview{width:100%;aspect-ratio:4/3;display:none;object-fit:cover;border-radius:16px;background:#0c0a07;margin:14px 0}.picker{display:block;border:1px dashed #806b45;border-radius:16px;padding:18px;text-align:center;color:#edcc82;cursor:pointer;margin:14px 0}.picker input{display:none}.modal-actions{display:flex;gap:10px}.modal-actions button{flex:1}.secondary{background:#2a241a;color:#fff}.progress{height:8px;border-radius:999px;background:#2a241a;overflow:hidden;margin-top:12px;display:none}.progress i{display:block;width:35%;height:100%;background:#edca7b;animation:load 1s linear infinite}@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(300%)}}@media(max-width:780px){body{padding:16px}.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.setup{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">L’appareil photo de Lau & Gio</div>
    <section class="hero"><h1>Défis<br>de la soirée</h1><div class="score"><strong id="score">0</strong><span>points pour votre table</span></div></section>
    <section class="setup">
      <input id="guestInput" placeholder="Votre prénom" autocomplete="name">
      <input id="tableInput" placeholder="Nom ou numéro de votre table" autocomplete="off">
      <button class="btn" id="join">Participer</button>
    </section>
    <nav class="tabs"><button class="tab active" data-tab="challenges">🎯 Mes défis</button><button class="tab" data-tab="ranking">🏆 Classement</button></nav>
    <section class="challenges show" id="challenges"><div class="empty">Indiquez votre prénom et votre table pour recevoir les défis.</div></section>
    <section class="ranking panel" id="ranking"><div class="empty">Chargement du classement…</div></section>
  </main>

  <div class="modal" id="proofModal">
    <section class="sheet">
      <h2 id="proofTitle">Preuve du défi</h2>
      <p id="proofText">Prenez ou choisissez une photo. Elle sera envoyée au mur de souvenirs et les points seront ajoutés automatiquement.</p>
      <img class="preview" id="preview" alt="Aperçu de la photo">
      <label class="picker">📸 Prendre ou choisir la photo<input id="proofFile" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label>
      <div class="progress" id="progress"><i></i></div>
      <div class="modal-actions"><button class="btn secondary" id="cancelProof">Annuler</button><button class="btn" id="sendProof" disabled>Envoyer et gagner les points</button></div>
    </section>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const $=id=>document.getElementById(id);
    let table=localStorage.getItem('lg_challenge_table')||'';
    let guest=localStorage.getItem('lg_challenge_guest')||'';
    let data=null,selectedChallenge=null,selectedFile=null,previewUrl='';
    const tableInput=$('tableInput'),guestInput=$('guestInput');
    tableInput.value=table;guestInput.value=guest;

    function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
    function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

    async function load(){
      try{
        const r=await fetch('/api/challenges?table='+encodeURIComponent(table),{cache:'no-store'}),d=await r.json();
        if(!r.ok||!d.ok)throw new Error();data=d;render();
      }catch{$('challenges').innerHTML='<div class="empty">Impossible de charger les défis.</div>'}
    }

    function render(){
      if(!data)return;$('score').textContent=data.score||0;const done=new Set(data.completed||[]);
      $('challenges').innerHTML=table&&guest?'<div class="grid">'+data.challenges.map(c=>`<article class="card ${done.has(c.id)?'done':''}"><div class="emoji">${c.emoji}</div><h2>${esc(c.title)}</h2><p>${esc(c.text)}</p><div class="points">+${c.points} points</div>${done.has(c.id)?'':`<button class="complete" data-id="${c.id}">📸 Réaliser ce défi</button>`}</article>`).join('')+'</div>':'<div class="empty">Indiquez votre prénom et votre table pour recevoir les défis.</div>';
      const max=Math.max(1,...data.leaderboard.map(x=>x.score));
      $('ranking').innerHTML=data.leaderboard.length?data.leaderboard.map(x=>`<div class="row"><div class="rank">${x.rank===1?'🥇':x.rank===2?'🥈':x.rank===3?'🥉':'#'+x.rank}</div><div><strong>${esc(x.name)}</strong><div class="bar"><i style="width:${Math.max(4,x.score/max*100)}%"></i></div></div><div><strong>${x.score}</strong><br><small>${x.completed} défis</small></div></div>`).join(''):'<div class="empty">Le classement commencera dès le premier défi validé.</div>';
      document.querySelectorAll('.complete').forEach(b=>b.addEventListener('click',()=>openProof(b.dataset.id)));
    }

    function openProof(id){
      selectedChallenge=data.challenges.find(c=>c.id===id);if(!selectedChallenge)return;
      selectedFile=null;$('proofFile').value='';$('sendProof').disabled=true;$('preview').style.display='none';
      $('proofTitle').textContent=selectedChallenge.emoji+' '+selectedChallenge.title;
      $('proofText').textContent=selectedChallenge.text+' Prenez la photo maintenant : elle sera ajoutée aux souvenirs du mariage.';
      $('proofModal').classList.add('open');
    }

    function closeProof(){
      $('proofModal').classList.remove('open');$('progress').style.display='none';
      if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=''}
    }

    $('proofFile').addEventListener('change',()=>{
      selectedFile=$('proofFile').files?.[0]||null;
      if(!selectedFile)return;
      if(selectedFile.size>12*1024*1024){selectedFile=null;$('proofFile').value='';return toast('Photo trop lourde : maximum 12 Mo');}
      if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(selectedFile);
      $('preview').src=previewUrl;$('preview').style.display='block';$('sendProof').disabled=false;
    });

    $('sendProof').addEventListener('click',async()=>{
      if(!selectedFile||!selectedChallenge||!table||!guest)return;
      $('sendProof').disabled=true;$('cancelProof').disabled=true;$('progress').style.display='block';
      try{
        const form=new FormData();form.append('photo',selectedFile);form.append('table',table);form.append('guest',guest);form.append('roll','99');form.append('shot',String(Date.now()).slice(-6));
        const upload=await fetch('/api/upload',{method:'POST',body:form}),uploadData=await upload.json();
        if(!upload.ok||!uploadData.ok)throw new Error(uploadData.error||'Envoi de la photo impossible');
        const complete=await fetch('/api/challenges/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table,challengeId:selectedChallenge.id})}),completeData=await complete.json();
        if(!complete.ok||!completeData.ok)throw new Error(completeData.error||'Points non ajoutés');
        data.completed=completeData.completed;data.score=completeData.score;data.leaderboard=completeData.leaderboard;
        closeProof();render();toast('🎉 Photo envoyée et +'+selectedChallenge.points+' points !');
      }catch(e){toast(e.message||'Une erreur est survenue')}
      finally{$('sendProof').disabled=false;$('cancelProof').disabled=false;$('progress').style.display='none'}
    });

    $('cancelProof').addEventListener('click',closeProof);
    $('proofModal').addEventListener('click',e=>{if(e.target===$('proofModal'))closeProof()});
    $('join').addEventListener('click',()=>{
      const t=tableInput.value.trim(),g=guestInput.value.trim();if(!g)return toast('Indiquez votre prénom');if(!t)return toast('Indiquez votre table');
      table=t;guest=g;localStorage.setItem('lg_challenge_table',table);localStorage.setItem('lg_challenge_guest',guest);load();toast('Bienvenue '+guest+' !');
    });
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('challenges').classList.toggle('show',b.dataset.tab==='challenges');$('ranking').classList.toggle('show',b.dataset.tab==='ranking')}));
    load();setInterval(load,5000);
  </script>
</body>
</html>
