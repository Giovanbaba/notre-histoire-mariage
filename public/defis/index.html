<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120f0a"><title>Défis photos | Lau & Gio</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#3a2e1c,#15110b 40%,#080706);color:#fff;font-family:Inter,system-ui,sans-serif;padding:22px}.wrap{max-width:1080px;margin:auto}.brand{color:#edcf87;letter-spacing:.24em;text-transform:uppercase;font-size:11px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;align-items:end;margin:12px 0 24px}.hero h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(45px,8vw,82px);line-height:.9;margin:0}.score{background:#19150f;border:1px solid #4c402b;border-radius:22px;padding:20px;text-align:center}.score strong{display:block;color:#efcb79;font-size:48px}.score span{color:#aaa}.setup,.panel{background:#15130fdd;border:1px solid #403728;border-radius:22px;padding:18px}.setup{display:flex;gap:10px;margin-bottom:20px}.setup input{flex:1;min-width:0;border:1px solid #51452f;border-radius:14px;background:#0d0b08;color:#fff;padding:14px;font-size:16px}.btn{border:0;border-radius:14px;padding:13px 16px;background:#edca7b;color:#1b150b;font-weight:900;cursor:pointer}.tabs{display:flex;gap:8px;margin:18px 0}.tab{border:1px solid #4b4131;background:#17140f;color:#ddd;border-radius:999px;padding:10px 15px;cursor:pointer}.tab.active{background:#edca7b;color:#1b150b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{position:relative;min-height:230px;padding:20px;border:1px solid #4b402e;border-radius:22px;background:linear-gradient(145deg,#211b12,#110f0b);display:flex;flex-direction:column}.emoji{font-size:40px}.card h2{font-family:Georgia,serif;font-weight:400;font-size:27px;margin:14px 0 8px}.card p{color:#bbb;line-height:1.45;margin:0 0 20px}.points{margin-top:auto;color:#edcc82;font-weight:900}.complete{margin-top:12px;width:100%;border:1px solid #68583d;background:#272116;color:#fff;border-radius:13px;padding:11px;font-weight:800;cursor:pointer}.card.done{opacity:.66}.card.done::after{content:'✓ Validé';position:absolute;top:15px;right:15px;background:#6bd287;color:#09220f;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900}.ranking{display:none}.ranking.show,.challenges.show{display:block}.challenges{display:none}.row{display:grid;grid-template-columns:55px 1fr auto;gap:12px;align-items:center;padding:14px 5px;border-bottom:1px solid #ffffff15}.rank{font-size:27px;font-weight:900;color:#edcc82}.bar{height:8px;background:#2a251d;border-radius:999px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#edca7b}.empty{text-align:center;color:#999;padding:40px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,30px);opacity:0;background:#edca7b;color:#171108;padding:12px 18px;border-radius:999px;font-weight:900;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:780px){body{padding:16px}.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.setup{flex-direction:column}}</style></head><body><main class="wrap"><div class="brand">L’appareil photo de Lau & Gio</div><section class="hero"><h1>Défis<br>de la soirée</h1><div class="score"><strong id="score">0</strong><span>points pour votre table</span></div></section><section class="setup"><input id="tableInput" placeholder="Nom ou numéro de votre table" autocomplete="off"><button class="btn" id="join">Participer</button></section><nav class="tabs"><button class="tab active" data-tab="challenges">🎯 Mes défis</button><button class="tab" data-tab="ranking">🏆 Classement</button></nav><section class="challenges show" id="challenges"><div class="empty">Indiquez votre table pour recevoir les défis.</div></section><section class="ranking panel" id="ranking"><div class="empty">Chargement du classement…</div></section></main><div class="toast" id="toast"></div><script>const $=id=>document.getElementById(id);let table=localStorage.getItem('lg_challenge_table')||'',data=null;const input=$('tableInput');input.value=table;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function load(){try{const r=await fetch('/api/challenges?table='+encodeURIComponent(table),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error();data=d;render()}catch{$('challenges').innerHTML='<div class="empty">Impossible de charger les défis.</div>'}}function render(){if(!data)return;$('score').textContent=data.score||0;const done=new Set(data.completed||[]);$('challenges').innerHTML=table?'<div class="grid">'+data.challenges.map(c=>`<article class="card ${done.has(c.id)?'done':''}"><div class="emoji">${c.emoji}</div><h2>${esc(c.title)}</h2><p>${esc(c.text)}</p><div class="points">+${c.points} points</div>${done.has(c.id)?'':`<button class="complete" data-id="${c.id}">J’ai réussi ce défi</button>`}</article>`).join('')+'</div>':'<div class="empty">Indiquez votre table pour recevoir les défis.</div>';const max=Math.max(1,...data.leaderboard.map(x=>x.score));$('ranking').innerHTML=data.leaderboard.length?data.leaderboard.map(x=>`<div class="row"><div class="rank">${x.rank===1?'🥇':x.rank===2?'🥈':x.rank===3?'🥉':'#'+x.rank}</div><div><strong>${esc(x.name)}</strong><div class="bar"><i style="width:${Math.max(4,x.score/max*100)}%"></i></div></div><div><strong>${x.score}</strong><br><small>${x.completed} défis</small></div></div>`).join(''):'<div class="empty">Le classement commencera dès le premier défi validé.</div>';document.querySelectorAll('.complete').forEach(b=>b.onclick=()=>complete(b.dataset.id))}async function complete(id){if(!table)return;const b=document.querySelector(`[data-id="${id}"]`);if(b){b.disabled=true;b.textContent='Validation…'}try{const r=await fetch('/api/challenges/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table,challengeId:id})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error);data.completed=d.completed;data.score=d.score;data.leaderboard=d.leaderboard;render();toast('🎉 Défi validé !')}catch(e){toast(e.message||'Erreur de validation');if(b)b.disabled=false}}$('join').onclick=()=>{const v=input.value.trim();if(!v)return toast('Indiquez votre table');table=v;localStorage.setItem('lg_challenge_table',table);load();toast('Table enregistrée !')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('challenges').classList.toggle('show',b.dataset.tab==='challenges');$('ranking').classList.toggle('show',b.dataset.tab==='ranking')});load();setInterval(load,5000);</script></body></html>
