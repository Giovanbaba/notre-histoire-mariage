<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172542"><title>Connexion aux jeux · Laura & Giovanni</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#384b70,#172542 55%,#0d1629);font-family:Inter,system-ui,sans-serif;color:#172542}.card{width:min(520px,100%);padding:30px;border-radius:28px;background:#fbf6ed;box-shadow:0 30px 90px #0008}.brand{text-align:center;color:#b58d44;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}h1{text-align:center;margin:12px 0 8px;font-family:Georgia,serif;font-size:42px;line-height:1}.intro{text-align:center;color:#756e61;line-height:1.5;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid input{width:100%;min-height:54px;padding:0 14px;border:1px solid #dacbad;border-radius:14px;background:#fff;color:#172542;font:inherit}.grid .wide{grid-column:1/-1}button{width:100%;min-height:58px;margin-top:14px;border:0;border-radius:15px;background:#172542;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.note{margin-top:14px;text-align:center;color:#8a8377;font-size:12px}.error{min-height:20px;margin:8px 0 0;text-align:center;color:#a33;font-size:13px}@media(max-width:520px){.grid{grid-template-columns:1fr}.grid .wide{grid-column:auto}}</style></head><body><main class="card"><div class="brand">Laura & Giovanni · 19 septembre 2026</div><h1>Bienvenue aux jeux du mariage</h1><p class="intro">Indiquez vos informations une seule fois. Votre profil restera connecté sur l’appareil photo, Hit & Kiss et Notre histoire.</p><form id="identityForm"><div class="grid"><input id="firstName" placeholder="Prénom" autocomplete="given-name" required><input id="lastName" placeholder="Nom" autocomplete="family-name" required><input class="wide" id="tableName" placeholder="Nom ou numéro de table" autocomplete="off" required></div><p class="error" id="error"></p><button>🎉 Accéder aux animations</button></form><p class="note">Après cette étape, vous choisirez votre jeu depuis l’accueil central.</p></main><script>const COOKIE='lg_identity',params=new URLSearchParams(location.search),next=params.get('next')||'/accueil/',changing=params.get('change')==='1';function read(){const row=document.cookie.split('; ').find(x=>x.startsWith(COOKIE+'='));if(!row)return null;try{return JSON.parse(decodeURIComponent(row.slice(COOKIE.length+1)))}catch{return null}}function save(v){document.cookie=`${COOKIE}=${encodeURIComponent(JSON.stringify(v))}; Max-Age=7776000; Path=/; Domain=.laura-giova.be; SameSite=Lax; Secure`;localStorage.setItem('lg-guest',`${v.firstName} ${v.lastName}`.trim());localStorage.setItem('lg-table',v.table);localStorage.setItem('lg_challenge_guest',`${v.firstName} ${v.lastName}`.trim());localStorage.setItem('lg_challenge_table',v.table)}const existing=read();if(existing&&!changing){location.replace(next)}else if(existing){firstName.value=existing.firstName||'';lastName.value=existing.lastName||'';tableName.value=existing.table||''}identityForm.onsubmit=e=>{e.preventDefault();const v={firstName:firstName.value.trim(),lastName:lastName.value.trim(),table:tableName.value.trim()};if(!v.firstName||!v.lastName||!v.table){error.textContent='Complétez les trois informations.';return}save(v);location.href=next};</script></body></html>
