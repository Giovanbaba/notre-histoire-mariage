<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15110b"><title>Mur IA | Lau & Gio</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090704;color:#fff;font-family:Inter,system-ui,sans-serif}button{font:inherit}.wall{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 18% 12%,#3c2e1c,#15100a 42%,#060504)}.header{position:absolute;z-index:50;top:24px;left:28px;text-shadow:0 3px 18px #000}.header small{display:block;color:#e9c97e;letter-spacing:.28em;text-transform:uppercase;font-size:11px}.header h1{font-family:Georgia,serif;font-size:clamp(30px,4.8vw,68px);font-weight:400;margin:4px 0 0}.status{position:absolute;z-index:50;right:26px;top:26px;padding:10px 14px;border:1px solid #ffffff25;border-radius:999px;background:#080604cc}.count{position:absolute;z-index:50;right:28px;bottom:28px;text-align:right}.count strong{display:block;color:#edcc7d;font:400 clamp(40px,6vw,80px) Georgia,serif}.count span{font-size:11px;letter-spacing:.2em;text-transform:uppercase}.board{position:absolute;inset:0}.polaroid{position:absolute;width:clamp(140px,14vw,235px);padding:9px 9px 34px;background:#f4f0e8;color:#2b241d;border-radius:4px;box-shadow:0 20px 55px #0009;cursor:pointer;animation:place .65s ease both}.polaroid.new{animation:drop 1s cubic-bezier(.2,.9,.3,1.25) both}.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.meta{position:absolute;left:10px;right:10px;bottom:8px;display:flex;justify-content:space-between;gap:7px;font-size:10px}.guest{font:15px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@keyframes place{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:rotate(var(--r))}}@keyframes drop{from{opacity:0;transform:translateY(-110vh) rotate(-20deg) scale(1.25)}to{opacity:1;transform:rotate(var(--r))}}.presenter{position:absolute;z-index:100;left:50%;top:50%;width:min(980px,90vw);transform:translate(-50%,-45%) scale(.94);opacity:0;pointer-events:none;display:grid;grid-template-columns:minmax(260px,.8fr) 1.2fr;gap:28px;align-items:center;padding:24px;border:1px solid #ffffff2c;border-radius:30px;background:#090705ed;backdrop-filter:blur(20px);box-shadow:0 30px 100px #000;transition:.4s}.presenter.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.presenter img{width:100%;max-height:64vh;object-fit:contain;border-radius:20px}.analysis .emoji{font-size:55px}.analysis .eyebrow{color:#e9c778;letter-spacing:.2em;text-transform:uppercase;font-size:11px}.analysis h2{font:400 clamp(34px,5vw,70px)/.95 Georgia,serif;margin:10px 0 16px}.analysis p{font-size:clamp(18px,2vw,28px);line-height:1.35;color:#eee}.badge{display:inline-block;margin-top:15px;padding:9px 13px;border-radius:999px;background:#edca7b;color:#181109;font-weight:900}.controls{position:absolute;z-index:120;left:50%;bottom:18px;display:flex;gap:8px;padding:9px;border-radius:18px;border:1px solid #ffffff22;background:#090705dd;transform:translate(-50%,125%);transition:.25s}.wall:hover .controls,.controls.show{transform:translate(-50%,0)}.controls button{border:1px solid #ffffff1c;background:#211a11;color:#fff;border-radius:12px;padding:11px 14px;cursor:pointer}.controls .on{background:#edca7b;color:#181109;font-weight:900}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.empty h2{font:400 clamp(45px,8vw,105px)/.92 Georgia,serif;margin:0}.empty p{color:#e3c47c;letter-spacing:.16em;text-transform:uppercase}.flash{position:absolute;inset:0;z-index:90;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .65s}@keyframes flash{0%{opacity:.92}100%{opacity:0}}@media(max-width:760px){.presenter{grid-template-columns:1fr;text-align:center;padding:16px}.presenter img{max-height:38vh}.analysis h2{font-size:37px}.analysis p{font-size:17px}.header{left:16px;top:16px}.status{right:16px;top:16px}.count{right:16px;bottom:75px}.polaroid{width:125px}.controls{width:calc(100% - 18px);justify-content:center;flex-wrap:wrap;bottom:8px}}</style></head><body><main class="wall" id="wall"><header class="header"><small>L’appareil photo de</small><h1>Notre mur IA</h1></header><div class="status" id="status">● Connexion…</div><div class="count"><strong id="count">0</strong><span>souvenirs partagés</span></div><section class="board" id="board"></section><section class="empty" id="empty"><div><h2>Le mur attend<br>vos souvenirs</h2><p>Les premières photos arrivent bientôt</p></div></section><section class="presenter" id="presenter"><img id="heroImg" alt="Photo mise en avant"><div class="analysis"><div class="eyebrow">Le présentateur IA annonce</div><div class="emoji" id="emoji">✨</div><h2 id="title"></h2><p id="comment"></p><span class="badge" id="badge"></span></div></section><nav class="controls" id="controls"><button id="shuffle">🔀 Mélanger</button><button id="voice" class="on">🔊 Voix active</button><button id="ai" class="on">🧠 IA active</button><button id="fullscreen">⛶ Plein écran</button></nav><div class="flash" id="flash"></div></main><script>const $=id=>document.getElementById(id);let known=new Set(),photos=[],first=true,busy=false,voiceOn=true,aiOn=true,showing=false;function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function seeded(k,min,max){return min+(hash(k)%10000)/10000*(max-min)}function esc(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function layout(p,i,total){const vw=innerWidth,vh=innerHeight,w=Math.max(125,Math.min(235,vw*.14)),top=120,bottom=70,uw=Math.max(20,vw-w-22),uh=Math.max(20,vh-w-top-bottom),cols=Math.max(2,Math.floor(vw/(w*.73))),rows=Math.max(1,Math.ceil(total/cols)),col=i%cols,row=Math.floor(i/cols);return{x:Math.max(8,Math.min(uw,(cols===1?uw/2:col/(cols-1)*uw)+seeded(p.key+'x',-w*.2,w*.2))),y:top+Math.max(4,Math.min(uh,(rows===1?uh/2:row/(rows-1)*uh)+seeded(p.key+'y',-w*.16,w*.16))),r:seeded(p.key+'r',-8,8)}}function render(list,newKeys=[]){photos=list.slice(0,80).reverse();$('board').innerHTML='';photos.forEach((p,i)=>{const pos=layout(p,i,photos.length),el=document.createElement('article');el.className='polaroid '+(newKeys.includes(p.key)?'new':'');el.style.left=pos.x+'px';el.style.top=pos.y+'px';el.style.setProperty('--r',pos.r+'deg');el.style.zIndex=i+1;el.innerHTML=`<img src="${p.url}" alt="Souvenir"><div class="meta"><span class="guest">${esc(p.guest||'Invité')}</span><span>${esc(p.table||'')}</span></div>`;el.onclick=()=>present(p,p.analysis||null);$('board').appendChild(el)});$('empty').style.display=photos.length?'none':'grid'}async function analyze(p){if(p.analysis)return p.analysis;try{const r=await fetch('/api/ai/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:p.key,guest:p.guest,table:p.table})}),d=await r.json();if(!r.ok||!d.ok)throw Error();p.analysis=d.analysis;return d.analysis}catch{return null}}async function speak(text){if(!voiceOn||!text)return;try{const r=await fetch('/api/ai/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(r.ok){const blob=await r.blob(),audio=new Audio(URL.createObjectURL(blob));await audio.play();return}}catch{}if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.94;u.pitch=.92;speechSynthesis.speak(u)}}async function present(p,existing){if(showing)return;showing=true;const a=existing||(aiOn?await analyze(p):null);if(!a){showing=false;return}$('heroImg').src=p.url;$('emoji').textContent=a.emoji||'✨';$('title').textContent=a.title||'Star de la soirée';$('comment').textContent=a.comment||'Cette photo mérite son moment de gloire.';$('badge').textContent='🏆 '+(a.badge||a.title||'Star de la soirée');$('presenter').classList.add('show');$('flash').classList.remove('go');void $('flash').offsetWidth;$('flash').classList.add('go');speak(a.comment);setTimeout(()=>{$('presenter').classList.remove('show');showing=false},9000)}async function load(){if(busy)return;busy=true;try{const r=await fetch('/api/dashboard',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error();$('status').textContent=`● Mur en direct · IA ${d.aiConfigured?'prête':'démo'}`;const fresh=d.recent.filter(p=>!known.has(p.key));render(d.recent,first?[]:fresh.map(p=>p.key));d.recent.forEach(p=>known.add(p.key));$('count').textContent=d.total;if(!first&&fresh.length&&aiOn)setTimeout(()=>present(fresh[0],fresh[0].analysis),900);first=false}catch{$('status').textContent='● Reconnexion…'}finally{busy=false}}$('shuffle').onclick=()=>{photos.sort(()=>Math.random()-.5);render(photos)};$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').classList.toggle('on',voiceOn);$('voice').textContent=voiceOn?'🔊 Voix active':'🔇 Voix coupée';if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel()};$('ai').onclick=()=>{aiOn=!aiOn;$('ai').classList.toggle('on',aiOn);$('ai').textContent=aiOn?'🧠 IA active':'🧠 IA en pause'};$('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')$('fullscreen').click();if(e.key.toLowerCase()==='v')$('voice').click();if(e.key.toLowerCase()==='i')$('ai').click()});let hide;document.onmousemove=()=>{$('controls').classList.add('show');clearTimeout(hide);hide=setTimeout(()=>$('controls').classList.remove('show'),2500)};addEventListener('resize',()=>render(photos));load();setInterval(load,3000);</script></body></html>
