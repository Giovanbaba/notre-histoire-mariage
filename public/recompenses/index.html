<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0906"><title>Récompenses | Lau & Gio</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#493716,#130f09 45%,#050403);color:#fff;font-family:Inter,system-ui,sans-serif}body{padding:24px}.wrap{max-width:1200px;margin:auto}.brand{color:#efcf83;letter-spacing:.25em;text-transform:uppercase;font-size:11px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:14px 0 25px}.head h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(48px,8vw,90px);line-height:.9;margin:0}.live{padding:10px 15px;border:1px solid #ffffff22;border-radius:999px;background:#15120dcc}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#70df8b;box-shadow:0 0 12px #70df8b;margin-right:7px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-bottom:18px}.winner,.side{border:1px solid #554528;border-radius:26px;background:linear-gradient(145deg,#231b0e,#100c07);padding:26px}.winner{min-height:330px;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}.winner:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,#efca7044,transparent 35%);animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.winner>*{position:relative}.crown{font-size:76px}.winner h2{font-family:Georgia,serif;font-size:clamp(38px,6vw,72px);margin:6px 0}.winner .score{font-size:30px;color:#efca78;font-weight:900}.winner p{color:#bbb}.side h3{font-family:Georgia,serif;font-size:28px;margin:0 0 15px}.podium{display:grid;gap:10px}.podium-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid #423620;border-radius:16px;background:#15110b}.medal{font-size:28px}.podium-row b{font-size:18px}.podium-row span{color:#efca78;font-weight:900}.awards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.award{padding:20px;border:1px solid #443821;border-radius:20px;background:#15110b}.award .emoji{font-size:36px}.award h3{font-family:Georgia,serif;font-size:24px;margin:10px 0 4px}.award strong{display:block;color:#efca78;font-size:20px}.award p{color:#aaa;font-size:13px;line-height:1.45}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.controls button{border:1px solid #ffffff22;border-radius:14px;background:#1c1710;color:#fff;padding:12px 16px;font-weight:900;cursor:pointer}.controls .primary{background:#efca78;color:#171108}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,30px);opacity:0;padding:12px 18px;border-radius:999px;background:#efca78;color:#171108;font-weight:900;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:850px){.hero{grid-template-columns:1fr}.awards{grid-template-columns:1fr 1fr}}@media(max-width:560px){body{padding:16px}.head{display:block}.live{display:inline-block;margin-top:16px}.awards{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand">L’appareil photo de Lau & Gio</div><header class="head"><h1>Les récompenses</h1><div class="live"><span class="dot"></span><span id="status">Connexion…</span></div></header><section class="hero"><article class="winner"><div><div class="crown">👑</div><p>Grande table gagnante</p><h2 id="winner">En attente</h2><div class="score" id="winnerScore">0 point</div></div></article><aside class="side"><h3>Podium des défis</h3><div class="podium" id="podium"></div></aside></section><section class="awards" id="awards"></section><div class="controls"><button id="refresh">↻ Actualiser</button><button id="announce" class="primary">🎤 Annoncer les récompenses</button><button id="fullscreen">⛶ Plein écran</button></div></main><div class="toast" id="toast"></div><script>const $=id=>document.getElementById(id);let challenge=null,dashboard=null,busy=false;function pretty(v){return String(v||'').replace(/-/g,' ')}function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2300)}function topPhotoTable(){return dashboard?.tables?.[0]||null}function mostChallenges(){return [...(challenge?.leaderboard||[])].sort((a,b)=>b.completed-a.completed||b.score-a.score)[0]||null}function render(){const board=challenge?.leaderboard||[],first=board[0];$('winner').textContent=first?pretty(first.name):'En attente';$('winnerScore').textContent=first?`${first.score} points`:'0 point';$('podium').innerHTML=board.slice(0,3).map((x,i)=>`<div class="podium-row"><div class="medal">${['🥇','🥈','🥉'][i]}</div><b>${pretty(x.name)}</b><span>${x.score} pts</span></div>`).join('')||'<p>Aucune table classée.</p>';const photo=topPhotoTable(),chall=mostChallenges(),active=[...(dashboard?.tables||[])].sort((a,b)=>b.count-a.count)[0];const awards=[['📸','Table paparazzi',photo?pretty(photo.name):'En attente',photo?`${photo.count} photos envoyées`:'Aucune photo'],['🏆','Machine à défis',chall?pretty(chall.name):'En attente',chall?`${chall.completed} défis réussis`:'Aucun défi'],['🔥','Table la plus active',active?pretty(active.name):'En attente',active?`${active.count} souvenirs partagés`:'En attente'],['👑','Championne de la soirée',first?pretty(first.name):'En attente',first?`${first.score} points au classement`:'En attente'],['🎭','Prix de l’ambiance','Choix de l’animateur','À attribuer depuis la régie'],['💛','Coup de cœur des mariés','Choix de Laura & Giovanni','À annoncer en fin de soirée']];$('awards').innerHTML=awards.map(a=>`<article class="award"><div class="emoji">${a[0]}</div><h3>${a[1]}</h3><strong>${a[2]}</strong><p>${a[3]}</p></article>`).join('')}async function load(){if(busy)return;busy=true;try{const [a,b]=await Promise.all([fetch('/api/challenges',{cache:'no-store'}),fetch('/api/dashboard',{cache:'no-store'})]);challenge=await a.json();dashboard=await b.json();if(!a.ok||!b.ok||!challenge.ok||!dashboard.ok)throw Error();$('status').textContent='Récompenses en direct';render()}catch{$('status').textContent='Reconnexion…'}finally{busy=false}}async function speak(text){try{const r=await fetch('/api/ai/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw Error();const audio=new Audio(URL.createObjectURL(await r.blob()));await audio.play()}catch{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))}}$('announce').onclick=()=>{const first=challenge?.leaderboard?.[0];if(!first)return toast('Aucune récompense à annoncer');speak(`Mesdames et messieurs, la grande table gagnante est ${pretty(first.name)}, avec ${first.score} points. Félicitations !`)};$('refresh').onclick=load;$('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}};load();setInterval(load,5000);</script></body></html>
